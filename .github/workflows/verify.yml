name: Verify and package

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: astra-build
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify checkpoint transport
        run: python tools/repair_checkpoint_transport.py
      - name: Apply durable source checkpoints
        run: python tools/apply_checkpoints.py
      - name: Verify canonical data and local images
        run: python tools/import_cards.py
      - name: Preserve checkpoint source and imported assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'build: preserve checkpoint source and pinned offline assets'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Run engine and integration tests
        run: |
          mkdir -p test-results
          set -o pipefail
          node --test --test-reporter=tap tests/*.test.js | tee test-results/engine.tap
      - name: Build both offline editions
        run: |
          node tools/build.mjs
          node tools/build.mjs --standalone
      - name: Install browser test tools
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Run real-browser acceptance tests
        run: python tests/browser_tabletop.py
      - name: Test isolated portable edition with networking disabled
        run: python tests/portable_test.py
      - name: Verify release contents and create archive
        run: python tools/package.py
      - name: Preserve tested application and acceptance reports
        run: |
          git add index.html test-results/build.json test-results/build-standalone.json test-results/browser.json test-results/portable.json test-results/engine.tap
          for report in test-results/release.json test-results/package-verification.json; do
            if [ -f "$report" ]; then git add "$report"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'release: preserve browser-tested offline build and verification reports'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Package complete source, assets, and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AstraSimulator-source
          include-hidden-files: true
          retention-days: 90
          path: |
            .
            !.git/**
            !node_modules/**
            !**/__pycache__/**
