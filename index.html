</style></head><body><div id="app"><div class="starting">Opening your laboratory…</div></div><div id="overlay"></div><noscript>JavaScript is required. No network connection is needed.</noscript><script>window.ASTRA_DATA={"cards":[{"id":"6511f317-bd38-46d0-b800-7125a3f420da","key":"aesi-tyrant-of-gyre-strait","name":"Aesi, Tyrant of Gyre Strait","manaCost":"{4}{G}{U}","manaValue":6,"typeLine":"Legendary Creature — Serpent","types":["Creature"],"subtypes":["Serpent"],"supertypes":["Legendary"],"oracleText":"You may play an additional land on each of your turns.\nLandfall — Whenever a land you control enters, you may draw a card.","colors":["G","U"],"colorIdentity":["G","U"],"keywords":["Landfall"],"power":"5","toughness":"5","loyalty":null,"defense":null,"layout":"normal","faces":[],"image":"assets/cards/6511f317-bd38-46d0-b800-7125a3f420da.jpg","backImage":null,"printId":"673c21f8-02b6-4ac4-b2fc-df065b4ac662","set":"dsc","collectorNumber":"210","source":"https://scryfall.com/card/dsc/210/aesi-tyrant-of-gyre-strait?utm_source=api","rulings":[{"object":"ruling","oracle_id":"6511f317-bd38-46d0-b800-7125a3f420da","source":"wotc","published_at":"2024-11-08","comment":"A landfall ability triggers whenever a land you control enters for any reason. It triggers whenever you play a land, as well as whenever a spell or ability puts a land onto the battlefield under your control."},{"object":"ruling","oracle_id":"6511f317-bd38-46d0-b800-7125a3f420da","source":"wotc","published_at":"2024-11-08","comment":"A landfall ability doesn't trigger if a permanent already on the battlefield becomes a land."},{"object":"ruling","oracle_id":"6511f317-bd38-46d0-b800-7125a3f420da","source":"wotc","published_at":"2024-11-08","comment":"Whenever a land you control enters, each landfall ability of the permanents you control will trigger. You can put them   on the stack in any order. The last ability you put on the stack will be the first one to resolve (As a result, you can have those abilities resolve in the order of your choosing.)."},{"object":"ruling","oracle_id":"6511f317-bd38-46d0-b800-7125a3f420da","source":"wotc","published_at":"2020-11-10","comment":"Aesi's ability is cumulative with other effects that let you play additional lands, such as the one from Exploration."}],"related":[],"metadataStatus":"canonical","oracleSnapshotAt":"2026-09-12T05:31:12.540830+00:00","candidate":true},{"id":"470ec98e-120c-446d-ade6-7d80aa836b55","key":"aetherworks-marvel","name":"Aetherworks Marvel","manaCost":"{4}","manaValue":4,"typeLine":"Legendary Artifact","types":["Artifact"],"subtypes":[],"supertypes":["Legendary"],"oracleText":"Whenever a permanent you control is put into a graveyard, you get {E} (an energy counter).\n{T}, Pay six {E}: Look at the top six cards of your library. You may cast a spell from among them without paying its mana cost. Put the rest on the bottom of your library in a random order.","colors":[],"colorIdentity":[],"keywords":[],"power":null,"toughness":null,"loyalty":null,"defense":null,"layout":"normal","faces":[],"image":"assets/cards/470ec98e-120c-446d-ade6-7d80aa836b55.jpg","backImage":null,"printId":"884f6948-3e03-48c6-8be2-6f2539386c9d","set":"kld","collectorNumber":"193","source":"https://scryfall.com/card/kld/193/aetherworks-marvel?utm_source=api","rulings":[{"object":"ruling","oracle_id":"470ec98e-120c-446d-ade6-7d80aa836b55","source":"wotc","published_at":"2024-06-07","comment":"Some spells and abilities that give you {E} may require targets. If each target chosen is an illegal target as that spell or ability tries to resolve, it won't resolve. You won't get any {E}."},{"object":"ruling","oracle_id":"470ec98e-120c-446d-ade6-7d80aa836b55","source":"wotc","published_at":"2024-06-07","comment":"If an effect says you get one or more {E}, you get that many energy counters. To pay one or more {E}, you lose that many energy counters. You can't pay more energy counters than you have. Any effects that interact with counters a player gets, has, or loses can interact with energy counters."},{"object":"ruling","oracle_id":"470ec98e-120c-446d-ade6-7d80aa836b55","source":"wotc","published_at":"2024-06-07","comment":"Energy counters aren't mana. They don't go away as steps, phases, and turns end, and effects that add mana \"of any type\" can't give you energy counters."},{"object":"ruling","oracle_id":"470ec98e-120c-446d-ade6-7d80aa836b55","source":"wotc","published_at":"2024-06-07","comment":"Some triggered abilities state that you \"may pay\" a certain amount of {E}. You can't pay that amount multiple times to multiply the effect. You simply choose whether or not to pay that amount of {E} as the ability resolves."},{"object":"ruling","oracle_id":"470ec98e-120c-446d-ade6-7d80aa836b55","source":"wotc","published_at":"2024-06-07","comment":"Some triggered abilities that state that you \"may pay\" a certain amount of {E} describe an effect that happens \"If you do.\" In that case, no player may take actions to try to stop the ability's effect after you make your choice. If the payment is followed by the phrase \"When you do,\" then you'll choose any targets for that reflexive triggered ability and put it on the stack before players can take actions."},{"object":"ruling","oracle_id":"470ec98e-120c-446d-ade6-7d80aa836b55","source":"wotc","published_at":"2024-06-07","comment":"If a spell or ability with one or more targets states that you \"may pay\" some amount of {E}, and each permanent that it targets has become an illegal target, the spell or ability won't resolve. You can't pay any {E} even if you want to."},{"object":"ruling","oracle_id":"470ec98e-120c-446d-ade6-7d80aa836b55","source":"wotc","published_at":"2024-06-07","comment":"{E} is the energy symbol. It represents one energy counter."},{"object":"ruling","oracle_id":"470ec98e-120c-446d-ade6-7d80aa836b55","source":"wotc","published_at":"2024-06-07","comment":"Energy counters are a kind of counter that a player may have. They're not associated with any specific permanents."},{"object":"ruling","oracle_id":"470ec98e-120c-446d-ade6-7d80aa836b55","source":"wotc","published_at":"2024-06-07","comment":"Keep track of how many energy counters each player has. Potential ways to track this include writing theme down on paper or using dice, but any method that is clear and mutually agreeable is fine. (At higher levels of tournament play, dice may not be allowed for tracking counters that players have.)"},{"object":"ruling","oracle_id":"470ec98e-120c-446d-ade6-7d80aa836b55","source":"wotc","published_at":"2016-09-20","comment":"Tokens that are sacrificed or destroyed are put into their owner's graveyard before ceasing to exist. If you controlled the token, Aetherworks Marvel's first ability will trigger."},{"object":"ruling","oracle_id":"470ec98e-120c-446d-ade6-7d80aa836b55","source":"wotc","published_at":"2016-09-20","comment":"The card cast with Aetherworks Marvel's second ability is cast from your library."},{"object":"ruling","oracle_id":"470ec98e-120c-446d-ade6-7d80aa836b55","source":"wotc","published_at":"2016-09-20","comment":"If you cast a card \"without paying its mana cost,\" you can't choose to cast it for any alternative costs, such as emerge costs. You can, however, pay additional costs. If the card has any mandatory additional costs, such as that of Incendiary Sabotage, you must pay those to cast the card."},{"object":"ruling","oracle_id":"470ec98e-120c-446d-ade6-7d80aa836b55","source":"wotc","published_at":"2016-09-20","comment":"If the card has {X} in its mana cost, you must choose 0 as the value of X when casting it without paying its mana cost."},{"object":"ruling","oracle_id":"470ec98e-120c-446d-ade6-7d80aa836b55","source":"wotc","published_at":"2016-09-20","comment":"Aetherworks Marvel's first ability triggers whenever any permanent you control is put into a graveyard from the battlefield, including Aetherworks Marvel itself and other permanents put into a graveyard at the same time as it."}],"related":[{"object":"related_card","id":"884f6948-3e03-48c6-8be2-6f2539386c9d","component":"combo_piece","name":"Aetherworks Marvel","type_line":"Legendary Artifact","uri":"https://api.scryfall.com/cards/884f6948-3e03-48c6-8be2-6f2539386c9d"},{"object":"related_card","id":"a446b9f8-cb22-408a-93ff-bee44a0dccc0","component":"combo_piece","name":"Energy Reserve","type_line":"Card","uri":"https://api.scryfall.com/cards/a446b9f8-cb22-408a-93ff-bee44a0dccc0"}],"metadataStatus":"canonical","oracleSnapshotAt":"2026-09-12T05:31:13.187753+00:00","candidate":true},{"id":"374e54d8-8e73-4268-9dde-c28c77bbbf32","key":"aftermath-analyst","name":"Aftermath Analyst","manaCost":"{1}{G}","manaValue":2,"typeLine":"Creature — Elf Detective","types":["Creature"],"subtypes":["Elf","Detective"],"supertypes":[],"oracleText":"When this creature enters, mill three cards. (Put the top three cards of your library into your graveyard.)\n{3}{G}, Sacrifice this creature: Return all land cards from your graveyard to the battlefield tapped.","colors":["G"],"colorIdentity":["G"],"keywords":["Mill"],"power":"1","toughness":"3","loyalty":null,"defense":null,"layout":"normal","faces":[],"image":"assets/cards/374e54d8-8e73-4268-9dde-c28c77bbbf32.jpg","backImage":null,"printId":"66f135b4-8cb3-4a4e-86ae-81a3cf4b7259","set":"eoc","collectorNumber":"91","source":"https://scryfall.com/card/eoc/91/aftermath-analyst?utm_source=api","rulings":[],"related":[],"metadataStatus":"canonical","oracleSnapshotAt":"2026-09-12T05:31:13.787071+00:00","candidate":true},{"id":"02f16726-f2f6-4943-b71a-93f8e26251d3","key":"ancient-den","name":"Ancient Den","manaCost":"","manaValue":0,"typeLine":"Artifact Land","types":["Artifact","Land"],"subtypes":[],"supertypes":[],"oracleText":"{T}: Add {W}.","colors":[],"colorIdentity":["W"],"keywords":[],"power":null,"toughness":null,"loyalty":null,"defense":null,"layout":"normal","faces":[],"image":"assets/cards/02f16726-f2f6-4943-b71a-93f8e26251d3.jpg","backImage":null,"printId":"d9a7b0f6-97f9-4937-865c-e25c142c3ed7","set":"eoc","collectorNumber":"148","source":"https://scryfall.com/card/eoc/148/ancient-den?utm_source=api","rulings":[],"related":[],"metadataStatus":"canonical","oracleSnapshotAt":"2026-09-12T05:31:14.450616+00:00","candidate":true},{"id":"3bcf090c-e890-4a9f-a8aa-6079e4ec9947","key":"ancient-greenwarden","name":"Ancient Greenwarden","manaCost":"{4}{G}{G}","manaValue":6,"typeLine":"Creature — Elemental","types":["Creature"],"subtypes":["Elemental"],"supertypes":[],"oracleText":"Reach (This creature can block creatures with flying.)\nYou may play lands from your graveyard.\nIf a land entering causes a triggered ability of a permanent you control to trigger, that ability triggers an additional time.","colors":["G"],"colorIdentity":["G"],"keywords":["Reach"],"power":"5","toughness":"7","loyalty":null,"defense":null,"layout":"normal","faces":[],"image":"assets/cards/3bcf090c-e890-4a9f-a8aa-6079e4ec9947.jpg","backImage":null,"printId":"12a0bf5c-a165-48f1-9a57-3a7cc9f3b0f9","set":"otc","collectorNumber":"186","source":"https://scryfall.com/card/otc/186/ancient-greenwarden?utm_source=api","rulings":[{"object":"ruling","oracle_id":"3bcf090c-e890-4a9f-a8aa-6079e4ec9947","source":"wotc","published_at":"2020-09-25","comment":"Ancient Greenwarden doesn't change the times when you can play those lands. You can still play only one land per turn, and only during your main phase when you have priority and the stack is empty."},{"object":"ruling","oracle_id":"3bcf090c-e890-4a9f-a8aa-6079e4ec9947","source":"wotc","published_at":"2020-09-25","comment":"Ancient Greenwarden doesn't allow you to activate abilities (such as cycling) of land cards in your graveyard."},{"object":"ruling","oracle_id":"3bcf090c-e890-4a9f-a8aa-6079e4ec9947","source":"wotc","published_at":"2020-09-25","comment":"Ancient Greenwarden allows you to play a modal double-faced card's land face, but not a nonland face."},{"object":"ruling","oracle_id":"3bcf090c-e890-4a9f-a8aa-6079e4ec9947","source":"wotc","published_at":"2020-09-25","comment":"Ancient Greenwarden's third ability affects a land's own enters-the-battlefield triggered abilities as well as other triggered abilities that trigger when that land enters the battlefield, such as landfall abilities. Such triggered abilities start with \"when\" or \"whenever.\""},{"object":"ruling","oracle_id":"3bcf090c-e890-4a9f-a8aa-6079e4ec9947","source":"wotc","published_at":"2020-09-25","comment":"Replacement effects are unaffected by Ancient Greenwarden's third ability. This includes any abilities that apply \"as [this land] enters the battlefield\" and any ability that says the land enters the battlefield with counters."},{"object":"ruling","oracle_id":"3bcf090c-e890-4a9f-a8aa-6079e4ec9947","source":"wotc","published_at":"2020-09-25","comment":"Ancient Greenwarden's effect doesn't copy the triggered ability; it causes the ability to trigger twice. Any choices made as you put the ability onto the stack, such as modes and targets, are made separately for each instance of the ability. Any choices made on resolution, such as whether to put counters on a permanent, are also made individually."},{"object":"ruling","oracle_id":"3bcf090c-e890-4a9f-a8aa-6079e4ec9947","source":"wotc","published_at":"2020-09-25","comment":"The trigger event doesn't have to specifically refer to \"lands.\" For example, an ability that triggers \"whenever a creature enters the battlefield under your control\" would trigger twice if the entering land is also a creature."},{"object":"ruling","oracle_id":"3bcf090c-e890-4a9f-a8aa-6079e4ec9947","source":"wotc","published_at":"2020-09-25","comment":"An ability that triggers whenever you play a land won't trigger an additional time."},{"object":"ruling","oracle_id":"3bcf090c-e890-4a9f-a8aa-6079e4ec9947","source":"wotc","published_at":"2020-09-25","comment":"Look at each permanent as it exists on the battlefield, taking into account continuous effects, to determine whether any triggered abilities will trigger multiple times. For example, if you control Ashaya, Soul of the Wild, a nontoken creature entering the battlefield will cause any appropriate abilities to trigger an additional time."},{"object":"ruling","oracle_id":"3bcf090c-e890-4a9f-a8aa-6079e4ec9947","source":"wotc","published_at":"2020-09-25","comment":"If you control two Ancient Greenwardens, a land entering the battlefield causes abilities to trigger three times, not four. A third Ancient Greenwarden causes abilities to trigger four times, a fourth causes abilities to trigger five times, and so on."},{"object":"ruling","oracle_id":"3bcf090c-e890-4a9f-a8aa-6079e4ec9947","source":"wotc","published_at":"2020-09-25","comment":"If a land entering the battlefield at the same time as Ancient Greenwarden (including Ancient Greenwarden itself if an effect causes it to be a land) causes a triggered ability of a permanent you control to trigger, that ability triggers an additional time."}],"related":[],"metadataStatus":"canonical","oracleSnapshotAt":"2026-09-12T05:31:15.104301+00:00","candidate":true},{"id":"0fdfe986-0216-468b-aac8-bbcf588fd894","key":"arcum-dagsson","name":"Arcum Dagsson","manaCost":"{3}{U}","manaValue":4,"typeLine":"Legendary Creature — Human Artificer","types":["Creature"],"subtypes":["Human","Artificer"],"supertypes":["Legendary"],"oracleText":"{T}: Target artifact creature's controller sacrifices it. That player may search their library for a noncreature artifact card, put it onto the battlefield, then shuffle.","colors":["U"],"colorIdentity":["U"],"keywords":[],"power":"2","toughness":"2","loyalty":null,"defense":null,"layout":"normal","faces":[],"image":"assets/cards/0fdfe986-0216-468b-aac8-bbcf588fd894.jpg","backImage":null,"printId":"f5ecf811-2efc-4fa6-9af8-ef09f559ec1a","set":"2xm","collectorNumber":"41","source":"https://scryfall.com/card/2xm/41/arcum-dagsson?utm_source=api","rulings":[{"object":"ruling","oracle_id":"0fdfe986-0216-468b-aac8-bbcf588fd894","source":"wotc","published_at":"2020-08-07","comment":"Arcum Dagsson's ability targets an artifact creature, not the player who controls it."},{"object":"ruling","oracle_id":"0fdfe986-0216-468b-aac8-bbcf588fd894","source":"wotc","published_at":"2020-08-07","comment":"If the target artifact creature is an illegal target by the time Arcum's ability tries to resolve, the ability won't resolve. No player searches their library. If the target is legal but not sacrificed (most likely because of an effect such as that of Sigarda, Host of Herons), its controller does search their library for a noncreature artifact card."},{"object":"ruling","oracle_id":"0fdfe986-0216-468b-aac8-bbcf588fd894","source":"wotc","published_at":"2020-08-07","comment":"Any triggered abilities that trigger when the creature is sacrificed will be put onto the stack at the same time as any triggered abilities that trigger when the noncreature artifact enters the battlefield."}],"related":[],"metadataStatus":"canonical","oracleSnapshotAt":"2026-09-12T05:31:15.752244+00:00","candidate":true},{"id":"189fc8f4-17ac-4f1d-82c8-8401445bdaf4","key":"azorius-chancery","name":"Azorius Chancery","manaCost":"","manaValue":0,"typeLine":"Land","types":["Land"],"subtypes":[],"supertypes":[],"oracleText":"This land enters tapped.\nWhen this land enters, return a land you control to its owner's hand.\n{T}: Add {W}{U}.","colors":[],"colorIdentity":["U","W"],"keywords":[],"power":null,"toughness":null,"loyalty":null,"defense":null,"layout":"normal","faces":[],"image":"assets/cards/189fc8f4-17ac-4f1d-82c8-8401445bdaf4.jpg","backImage":null,"printId":"50ef0ac3-e911-4d67-a751-8d86160ae843","set":"dsc","collectorNumber":"261","source":"https://scryfall.com/card/dsc/261/azorius-chancery?utm_source=api","rulings":[{"object":"ruling","oracle_id":"189fc8f4-17ac-4f1d-82c8-8401445bdaf4","source":"wotc","published_at":"2013-04-15","comment":"If this land enters the battlefield and you control no other lands, its ability will force you to return it to your -ace8-d673f10e0714","set":"nph","collectorNumber":"104","source":"https://scryfall.com/card/nph/104/birthing-pod?utm_source=api","rulings":[{"object":"ruling","oracle_id":"f8b9dd54-0837-47f4-ad14-7a0322d46d5f","source":"wotc","published_at":"2011-06-01","comment":"A card with Phyrexian mana symbols in its mana cost is each color that appears in that mana cost, regardless of how that cost may have been paid."},{"object":"ruling","oracle_id":"f8b9dd54-0837-47f4-ad14-7a0322d46d5f","source":"wotc","published_at":"2011-06-01","comment":"To calculate the mana value of a card with Phyrexian mana symbols in its cost, count each Phyrexian mana symbol as 1."},{"object":"ruling","oracle_id":"f8b9dd54-0837-47f4-ad14-7a0322d46d5f","source":"wotc","published_at":"2011-06-01","comment":"As you cast a spell or activate an activated ability with one or more Phyrexian mana symbols in its cost, you choose how to pay for each Phyrexian mana symbol at the same time you would choose modes or choose a value for X."},{"object":"ruling","oracle_id":"f8b9dd54-0837-47f4-ad14-7a0322d46d5f","source":"wotc","published_at":"2011-06-01","comment":"If you're at 1 life or less, you can't pay 2 life."},{"object":"ruling","oracle_id":"f8b9dd54-0837-47f4-ad14-7a0322d46d5f","source":"wotc","published_at":"2011-06-01","comment":"Phyrexian mana is not a new color. Players can't produce Phyrexian mana."},{"object":"ruling","oracle_id":"f8b9dd54-0837-47f4-ad14-7a0322d46d5f","source":"wotc","published_at":"2011-06-01","comment":"A creature's mana value is determined solely by the mana symbols printed in its upper right corner (unless that creature is copying something else; see below). If its mana cost includes {X}, X is considered to be 0. If it has no mana symbols in its upper right corner (because it's an animated land, for example), its mana value is 0. Ignore any alternative costs or additional costs (such as kicker) paid when the creature was cast."},{"object":"ruling","oracle_id":"f8b9dd54-0837-47f4-a t":"{3}","manaValue":3,"typeLine":"Artifact","types":["Artifact"],"subtypes":[],"supertypes":[],"oracleText":"You may play lands from your graveyard.","colors":[],"colorIdentity":[],"keywords":[],"power":null,"toughness":null,"loyalty":null,"defense":null,"layout":"normal","faces":[],"image":"assets/cards/33c722cf-b4bf-431f-aefd-ee96241a7fbf.jpg","backImage":null,"printId":"7f4893ef-f983-418b-b7a4-5f073c844545","set":"2x2","collectorNumber":"303","source":"https://scryfall.com/card/2x2/303/crucible-of-worlds?utm_source=api","rulings":[{"object":"ruling","oracle_id":"33c722cf-b4bf-431f-aefd-ee96241a7fbf","source":"wotc","published_at":"2018-07-13","comment":"Crucible of Worlds doesn't change the times when you can play those land cards. You can still play only one land per turn, and only during your main phase when you have priority and the stack is empty."},{"object":"ruling","oracle_id":"33c722cf-b4bf-431f-aefd-ee96241a7fbf","source":"wotc","published_at":"2018-07-13","comment":"Crucible of Worlds doesn't allow you to activate abilities (such as cycling) of land cards in your graveyard."}],"related":[],"metadataStatus":"canonical","oracleSnapshotAt":"2026-09-12T05:31:25.074784+00:00","candidate":true},{"id":"b1f8eb7b-7e01-4bf8-a557-64e16a6052af","key":"crystal-skull-isu-spyglass","name":"Crystal Skull, Isu Spyglass","manaCost":"{2}{U}{U}","manaValue":4,"typeLine":"Legendary Artifact","types":["Artifact"],"subtypes":[],"supertypes":["Legendary"],"oracleText":"You may look at the top card of your library any time.\nYou may play historic lands and cast historic spells from the top of your library. (Artifacts, legendaries, and Sagas are historic.)\n{T}: Add {U}.","colors":["U"],"colorIdentity":["U"],"keywords":[],"power":null,"toughness":null,"loyalty":null,"defense":null,"layout":"normal","faces":[],"image":"assets/cards/b1f8eb7b-7e01-4bf8-a557-64e16a6052af.jpg","backImage":null,"printId":"b10fa72b-6742-4b65-8654-ac70b6240e38","set":"acr","collectorNumber":"15","source":"https://scryfall.com/card/acr/15/crystal-skull-isu-spyglass?utm_source=api","rulings":[{"object":"ruling","oracle_id":"b1f8eb7b-7e01-4bf8-a557-64e16a6052af","source":"wotc","published_at":"2024-07-05","comment":"You can look at the top card of your library whenever you want (with one restriction; see below), even if you don’t have priority. This action doesn’t use the stack. Knowing what that card is becomes part of the information you have access to, just like you can look at the cards in your hand."},{"object":"ruling","oracle_id":"b1f8eb7b-7e01-4bf8-a557-64e16a6052af","source":"wotc","published_at":"2024-07-05","comment":"If the top card of your library changes while you’re casting a spell, playing a land, or activating an ability, you can’t look at the new top card until you finish doing so. This means that if you cast a spell from the top of your library, you can’t look at the next one until you’re done paying for that spell."},{"object":"ruling","oracle_id":"b1f8eb7b-7e01-4bf8-a557-64e16a6052af","source":"wotc","published_at":"2024-07-05","comment":"You must pay all costs and follow all timing rules for spells cast from the top of your library this way."},{"object":"ruling","oracle_id":"b1f8eb7b-7e01-4bf8-a557-64e16a6052af","source":"wotc","published_at":"2024-07-05","comment":"If the top card of your library is a historic card with a disguise or morph ability, you can’t cast it face down from the top of your library with the permission granted by Crystal Skull because the resulting spell would not be a historic spell."},{"object":"ruling","oracle_id":"b1f8eb7b-7e01-4bf8-a557-64e16a6052af","source":"wotc","published_at":"2024-07-05","comment":"A card, spell, or permanent is historic if it has the legendary supertype, the artifact card type, or the Saga subtype. Having two of those qualities doesn’t make an object more historic than another or provide an additional bonus—an object either is historic or it isn’t."},{"object":"ruling","oracle_id":"b1f8eb7b-7e01-4bf8-a557-64e16a6052af","source":"wotc","published_at":"2024-07-05","comment":"Some abilities trigger “whenever you cast a historic spell.” Such an ability resolves before the spell that caused it to trigger. It resolves even if that spell is countered."},{"object":"ruling","oracle_id":"b1f8eb7b-7e01-4bf8-a557-64e16a6052af","source":"wotc","published_at":"2024-07-05","comment":"An ability that triggers “whenever you cast a historic spell” doesn’t trigger if a historic card is put onto the battlefield without being cast."},{"object":"ruling","oracle_id":"b1f8eb7b-7e01-4bf8-a557-64e16a6052af","source":"wotc","published_at":"2024-07-05","comment":"Lands are never cast, so abilities that trigger “whenever you cast a historic spell” won’t trigger if you play a legendary land. They also won’t trigger if a card on the battlefield transforms into a card with the legendary supertype, the artifact card type, or the Saga subtype."}],"related":[],"metadataStatus":"canonical","oracleSnapshotAt":"2026-09-12T05:31:25.655711+00:00","candidate":true},{"id":"4d8505d3-c8a1-4850-95d4-5ddb8ad49770","key":"cultivator-colossus","name":"Cultivator Colossus","manaCost":"{4}{G}{G}{G}","manaValue":7,"typeLine":"Creature — Plant Beast","types":["Creature"],"subtypes":["Plant","Beast"],"supertypes":[],"oracleText":"Trample\nCultivator Colossus's power and toughness are each equal to the number of lands you control.\nWhen this creature enters, you may put a land card from your hand onto the battlefield tapped. If you do, draw a card and repeat this process.","colors":["G"],"colorIdentity":["G"],"keywords":["Trample"],"power":"*","toughness":"*","loyalty":null,"defense":null,"layout":"normal","faces":[],"image":"assets/cards/4d8505d3-c8a1-4850-95d4-5ddb8ad49770.jpg","backImage":null,"printId":"426ed66e-41b3-4e44-90a2-697aafaa8c5c","set":"inr","collectorNumber":"190","source":"https://scryfall.com/card/inr/190/cultivator-colossus?utm_source=api","rulings":[{"object":"ruling","oracle_id":"4d8505d3-c8a1-4850-95d4-5ddb8ad49770","source":"wotc","published_at":"2021-11-19","comment":"You repeat the process as part of Cultivator Colossus's triggered ability's resolution. If the land you put onto the battlefield caused any abilities to trigger, those abilities won't go on the stack until after the ability has finished resolving."},{"object":"ruling","oracle_id":"4d8505d3-c8a1-4850-95d4-5ddb8ad49770","source":"wotc","published_at":"2021-11-19","comment":"The process is repeated until you decline to put a land card onto the battlefield."}],"related":[],"metadataStatus":"canonical","oracleSnapshotAt":"2026-09-12T05:31:26.230062+00:00","candidate":true},{"id":"2065cada-4078-41c4-9e06-2460d2a2e8ee","key":"darkmoss-bridge","name":"Darkmoss Bridge","manaCost":"","manaValue":0,"typeLine":"Artifact Land","types":["Artifact","Land"],"subtypes":[],"supertypes":[],"oracleText":"This land enters tapped.\nIndestructible\n{T}: Add {B} or {G}.","colors":[],"colorIdentity":["B","G"],"keywords":["Indestructible"],"power":null,"toughness":null,"loyalty":null,"defense":null,"layout":"normal","faces":[],"image":"assets/cards/2065cada-4078-41c4-9e06-2460d2a2e8ee.jpg","backImage":null,"printId":"3ca3ef68-ea62-4098-bd43-4597ff0647d4","set":"dsc","collectorNumber":"269","source":"https://scryfall.com/card/dsc/269/darkmoss-bridge?utm_source=api","rulings":[],"related":[],"metadataStatus":"canonical","oracleSnapshotAt":"2026-09-12T05:31:26.881148+00:00","candidate":true},{"id":"8dc067bf-f78f-4ac4-b6e7-b305c42cf0bc","key":"darksteel-citadel","name":"Darksteel Citadel","manaCost":"","manaValue":0,"typeLine":"Artifact Land","types":["Artifact","Land"],"subtypes":[],"supertypes":[],"oracleText":"Indestructible\n{T}: Add {C}.","colors":[],"colorIdentity":[],"keywords":["Indestructible"],"power":null,"toughness":null,"loyalty":null,"defense":null,"layout":"normal","faces":[],"image":"assets/cards/8dc067bf-f78f-4ac4-b6e7-b305c42cf0bc.jpg","backImage":null,"printId":"2ba7597d-6d76-45b8-b172-34299 ["U"],"colorIdentity":["U"],"keywords":["Avoidance"],"power":"2","toughness":"2","loyalty":null,"defense":null,"layout":"normal","faces":[],"image":"assets/cards/09ef446c-a13d-49d9-a94c-cd5f5a2d440b.jpg","backImage":null,"printId":"c7a401b8-29fb-46ef-a663-427f66724d5c","set":"clb","collectorNumber":"63","source":"https://scryfall.com/card/clb/63/displacer-kitten?utm_source=api","rulings":[{"object":"ruling","oracle_id":"09ef446c-a13d-49d9-a94c-cd5f5a2d440b","source":"wotc","published_at":"2022-06-10","comment":"If a token is exiled this way, it will cease to exist and won't return to the battlefield."},{"object":"ruling","oracle_id":"09ef446c-a13d-49d9-a94c-cd5f5a2d440b","source":"wotc","published_at":"2022-06-10","comment":"When the card returns to the battlefield, it will be a new object with no connection to the card that was exiled. Auras attached to the exiled creature will be put into their owners' graveyards. Any Equipment will become unattached and remain on the battlefield. Any counters on the exiled permanent will cease to exist."}],"related":[],"metadataStatus":"canonical","oracleSnapshotAt":"2026-09-12T05:31:28.787690+00:00","candidate":true},{"id":"44b83535-fdbf-4307-bf53-ca20470a768d","key":"drossforge-bridge","name":"Drossforge Bridge","manaCost":"","manaValue":0,"typeLine":"Artifact Land","types":["Artifact","Land"],"subtypes":[],"supertypes":[],"oracleText":"This land enters tapped.\nIndestructible\n{T}: Add {B} or {R}.","colors":[],"colorIdentity":["B","R"],"keywords":["Indestructible"],"power":null,"toughness":null,"loyalty":null,"defense":null,"layout":"normal","faces":[],"image":"assets/cards/44b83535-fdbf-4307-bf53-ca20470a768d.jpg","backImage":null,"printId":"5b46b8d8-723a-4752-b97d-29ef83bd294c","set":"mh2","collectorNumber":"246","source":"https://scryfall.com/card/mh2/246/drossforge-bridge?utm_source=api","rulings":[],"related":[],"metadataStatus":"canonical","oracleSnapshotAt":"2026-09-12T05:31:29.437296+00:00","candidate":true},{"id":"0f77c0c9-4dc4-489a-b547-e93287c4d1a5","key":"eldritch-evolution","name":"Eldritch Evolution","manaCost":"{1}{G}{G}","manaValue":3,"typeLine":"Sorcery","types":["Sorcery"],"subtypes":[],"supertypes":[],"oracleText":"As an additional cost to cast this spell, sacrifice a creature.\nSearch your library for a creature card with mana value X or less, where X is 2 plus the sacrificed creature's mana value. Put that card onto the battlefield, then shuffle. Exile Eldritch Evolution.","colors":["G"],"colorIdentity":["G"],"keywords":[],"power":null,"toughness":null,"loyalty":null,"defense":null,"layout":"normal","faces":[],"image":"assets/cards/0f77c0c9-4dc4-489a-b547-e93287c4d1a5.jpg","backImage":null,"printId":"606caf13-c0d3-4a61-9a1a-32f13b6448ab","set":"inr","collectorNumber":"195","source":"https://scryfall.com/card/inr/195/eldritch-evolution?utm_source=api","rulings":[{"object":"ruling","oracle_id":"0f77c0c9-4dc4-489a-b547-e93287c4d1a5","source":"wotc","published_at":"2016-07-13","comment":"Sacrificing a creature is part of Eldritch Evolution's cost. You can't sacrifice more creatures to search for more creature cards, and you can't cast Eldritch Evolution at all if you control no creatures."},{"object":"ruling","oracle_id":"0f77c0c9-4dc4-489a-b547-e93287c4d1a5","source":"wotc","published_at":"2016-07-13","comment":"Once you begin to cast Eldritch Evolution, no player may take actions until you're done. Notably, opponents can't try to remove the creature you wish to sacrifice."},{"object":"ruling","oracle_id":"0f77c0c9-4dc4-489a-b547-e93287c4d1a5","source":"wotc","published_at":"2016-07-13","comment":"A creature's mana value is determined solely by the mana symbols printed in its upper right corner (unless that creature is the back face of a double-faced card, a melded card, or is copying something else; see below). If the mana cost includes {X}, X is considered to be 0. If it's a single-faced card with no mana symbols in its upper right corner (because it's an animated lan ee or more artifacts.","colors":[],"colorIdentity":[],"keywords":[],"power":null,"toughness":null,"loyalty":null,"defense":null,"layout":"normal","faces":[],"image":"assets/cards/91d4a5fe-fd6d-4b14-a63f-61b4d0ecd9c4.jpg","backImage":null,"printId":"275471e3-ded1-40ac-91ef-369dce5764d9","set":"kld","collectorNumber":"247","source":"https://scryfall.com/card/kld/247/inventors-fair?utm_source=api","rulings":[{"object":"ruling","oracle_id":"91d4a5fe-fd6d-4b14-a63f-61b4d0ecd9c4","source":"wotc","published_at":"2018-01-19","comment":"There are many important moments in the story, but the most crucial—called “story spotlights”—are shown on cards. These cards have the Planeswalker symbol in their text box; this symbol has no effect on gameplay. You can read more about these events in the official Magic fiction at http://www.mtgstory.com."},{"object":"ruling","oracle_id":"91d4a5fe-fd6d-4b14-a63f-61b4d0ecd9c4","source":"wotc","published_at":"2016-09-20","comment":"When using Inventors' Fair's activated ability, the number of artifacts you control is checked only as you activate it. It's not checked again as the ability resolves."},{"object":"ruling","oracle_id":"91d4a5fe-fd6d-4b14-a63f-61b4d0ecd9c4","source":"wotc","published_at":"2016-09-20","comment":"No player may take actions in a turn before Inventors' Fair's triggered ability checks to see if it should trigger. If you don't control three or more artifacts, it won't trigger."},{"object":"ruling","oracle_id":"91d4a5fe-fd6d-4b14-a63f-61b4d0ecd9c4","source":"wotc","published_at":"2016-09-20","comment":"If you control three artifacts as the ability resolves, you gain 1 life. The artifacts you control as the ability resolves don't have to be the same ones you controlled as it triggered. If you don't control three artifacts at that time, you won't gain life."}],"related":[],"metadataStatus":"canonical","oracleSnapshotAt":"2026-09-12T05:31:46.948638+00:00","candidate":true},{"id":"1cb9d94a-3039-4f2e-8fcc-6996f9a45f74","key":"iz nto your hand, then shuffle.","colors":[],"colorIdentity":[],"keywords":[],"power":null,"toughness":null,"loyalty":null,"defense":null,"layout":"normal","faces":[],"image":"assets/cards/373395b2-f04b-46c9-b9f4-4f6815b71009.jpg","backImage":null,"printId":"87778e37-af92-402e-b037-5fbd6112b682","set":"mid","collectorNumber":"255","source":"https://scryfall.com/card/mid/255/moonsilver-key?utm_source=api","rulings":[{"object":"ruling","oracle_id":"373395b2-f04b-46c9-b9f4-4f6815b71009","source":"wotc","published_at":"2021-09-24","comment":"Some artifacts, such as Gauntlet of Power, have triggered mana abilities. A triggered mana ability is a triggered ability that could produce mana as it resolves, triggers on the resolution of an activated mana ability or on mana being added, and doesn't require a target."},{"object":"ruling","oracle_id":"373395b2-f04b-46c9-b9f4-4f6815b71009","source":"wotc","published_at":"2021-09-24","comment":"Most mana abilities found on artifacts are activated mana abilities. An activated mana ability is an activated ability that could produce mana as it resolves, does not require a target, and isn't a loyalty ability."}],"related":[],"metadataStatus":"canonical","oracleSnapshotAt":"2026-09-12T05:32:00.464629+00:00","candidate":true},{"id":"6288c0cb-cf32-4ae9-abf0-104ec71654fa","key":"moraug-fury-of-akoum","name":"Moraug, Fury of Akoum","manaCost":"{4}{R}{R}","manaValue":6,"typeLine":"Legendary Creature — Minotaur Warrior","types":["Creature"],"subtypes":["Minotaur","Warrior"],"supertypes":["Legendary"],"oracleText":"Each creature you control gets +1/+0 for each time it has attacked this turn.\nLandfall — Whenever a land you control enters, if it's your main phase, there's an additional combat phase after this phase. At the beginning of that combat, untap all creatures you control.","colors":["R"],"colorIdentity":["R"],"keywords":["Landfall"],"power":"6","toughness":"6","loyalty":null,"defense":null,"layout":"normal","faces":[],"image":"assets/card ap creatures you control at the beginning of the additional combat but not at the beginning of your regular combat."}],"related":[],"metadataStatus":"canonical","oracleSnapshotAt":"2026-09-12T05:32:01.037232+00:00","candidate":true},{"id":"7a43bd27-fdd8-41f0-9bc4-92568f3408f1","key":"mox-amber","name":"Mox Amber","manaCost":"{0}","manaValue":0,"typeLine":"Legendary Artifact","types":["Artifact"],"subtypes":[],"supertypes":["Legendary"],"oracleText":"{T}: Add one mana of any color among legendary creatures and planeswalkers you control.","colors":[],"colorIdentity":[],"keywords":[],"power":null,"toughness":null,"loyalty":null,"defense":null,"layout":"normal","faces":[],"image":"assets/cards/7a43bd27-fdd8-41f0-9bc4-92568f3408f1.jpg","backImage":null,"printId":"66024e69-ad60-4c9a-a0ca-da138d33ad80","set":"dom","collectorNumber":"224","source":"https://scryfall.com/card/dom/224/mox-amber?utm_source=api","rulings":[{"object":"ruling","oracle_id":"7a43bd27-fdd8-41f0-9bc4-92568f3408f1","source":"wotc","published_at":"2018-04-27","comment":"Mox Amber's ability adds one mana of the color of your choice from among the colors of legendary creatures and legendary planeswalkers you control. It doesn't add one mana of each of those colors."},{"object":"ruling","oracle_id":"7a43bd27-fdd8-41f0-9bc4-92568f3408f1","source":"wotc","published_at":"2018-04-27","comment":"If you control no legendary creatures or legendary planeswalkers, you can activate Mox Amber's ability, but you won't add any mana."},{"object":"ruling","oracle_id":"7a43bd27-fdd8-41f0-9bc4-92568f3408f1","source":"wotc","published_at":"2018-04-27","comment":"If your legendary creatures and legendary planeswalkers are all colorless, you can activate Mox Amber's ability, but you won't add any mana. Colorless is not a color."}],"related":[],"metadataStatus":"canonical","oracleSnapshotAt":"2026-09-12T05:32:01.609372+00:00","candidate":true},{"id":"de2440de-e948-4811-903c-0bbe376ff64d","key":"mox-opal","name":"Mox Opal","man ,"collectorNumber":"98","source":"https://scryfall.com/card/otj/98/pitiless-carnage?utm_source=api","rulings":[{"object":"ruling","oracle_id":"186bfdac-ce9c-476f-89b6-ef467487fca5","source":"wotc","published_at":"2024-04-12","comment":"You sacrifice the permanents as part of the resolution of Pitiless Carnage. It isn’t an additional cost. If Pitiless Carnage is countered or never resolves, you won’t sacrifice anything."},{"object":"ruling","oracle_id":"186bfdac-ce9c-476f-89b6-ef467487fca5","source":"wotc","published_at":"2024-04-12","comment":"You can choose to sacrifice zero permanents. (That does sound an awful lot like pity, though.)"},{"object":"ruling","oracle_id":"186bfdac-ce9c-476f-89b6-ef467487fca5","source":"wotc","published_at":"2024-04-12","comment":"If any abilities trigger as you sacrifice permanents, those abilities won’t be put onto the stack until after you’ve drawn the appropriate number of cards."},{"object":"ruling","oracle_id":"186bfdac-ce9c-476f-89b6-ef467487fca5","source":"wotc","published_at":"2024-04-12","comment":"Plot abilities are written “Plot [cost],” which means “Any time you have priority during your main phase while the stack is empty, you may pay [cost] and exile this card from your hand. It becomes plotted.”"},{"object":"ruling","oracle_id":"186bfdac-ce9c-476f-89b6-ef467487fca5","source":"wotc","published_at":"2024-04-12","comment":"Exiling a card using its plot ability is a special action. Once you announce you’re taking that action, no other player can respond by trying to remove that card from your hand."},{"object":"ruling","oracle_id":"186bfdac-ce9c-476f-89b6-ef467487fca5","source":"wotc","published_at":"2024-04-12","comment":"You can’t cast a plotted card on the same turn it became plotted. On any future turn, you may cast that card from exile without paying its mana cost during your main phase while the stack is empty."},{"object":"ruling","oracle_id":"186bfdac-ce9c-476f-89b6-ef467487fca5","source":"wotc","published_at":"2024-04-12","comment":"If you’re casting a plotted card from exile without paying its mana cost, you can’t choose to cast it for any other alternative costs. You can, however, pay additional costs, such as kicker costs. If the plotted card has any mandatory additional costs, those must still be paid to cast the spell."},{"object":"ruling","oracle_id":"186bfdac-ce9c-476f-89b6-ef467487fca5","source":"wotc","published_at":"2024-04-12","comment":"If a plotted card has {X} in its mana cost, you must choose 0 as the value of X when casting it without paying its mana cost."}],"related":[{"object":"related_card","id":"2bea6391-e70d-4f36-86b7-fd08440b4976","component":"combo_piece","name":"Pitiless Carnage","type_line":"Sorcery","uri":"https://api.scryfall.com/cards/2bea6391-e70d-4f36-86b7-fd08440b4976"},{"object":"related_card","id":"f07677af-88a4-4ff5-b591-e1e3ac05235d","component":"combo_piece","name":"Plot","type_line":"Card","uri":"https://api.scryfall.com/cards/f07677af-88a4-4ff5-b591-e1e3ac05235d"}],"metadataStatus":"canonical","oracleSnapshotAt":"2026-09-12T05:32:10.780407+00:00","candidate":true},{"id":"301d1d8e-d3fc-4010-8b29-4724fa0b31cd","key":"portal-to-phyrexia","name":"Portal to Phyrexia","manaCost":"{9}","manaValue":9,"typeLine":"Artifact","types":["Artifact"],"subtypes":[],"supertypes":[],"oracleText":"When this artifact enters, each opponent sacrifices three creatures of their choice.\nAt the beginning of your upkeep, put target creature card from a graveyard onto the battlefield under your control. It's a Phyrexian in addition to its other types.","colors":[],"colorIdentity":[],"keywords":[],"power":null,"toughness":null,"loyalty":null,"defense":null,"layout":"normal","faces":[],"image":"assets/cards/301d1d8e-d3fc-4010-8b29-4724fa0b31cd.jpg","backImage":null,"printId":"5f608efc-0dbc-4cc3-aadd-ed473bfc29ab","set":"bro","collectorNumber":"240","source":"https://scryfall.com/card/bro/240/portal-to-phyrexia?utm_source=api","rulings":[],"related":[],"metadataStatus 0-414c-a7de-d773b8b4cc82","component":"combo_piece","name":"Ultron Drone","type_line":"Artifact Creature — Robot Villain","uri":"https://api.scryfall.com/cards/149a0a3b-c470-414c-a7de-d773b8b4cc82"},{"object":"related_card","id":"df9302a8-e918-429c-8853-133c489223f1","component":"combo_piece","name":"Ultron, Artificial Malevolence","type_line":"Legendary Artifact Creature — Robot Villain","uri":"https://api.scryfall.com/cards/df9302a8-e918-429c-8853-133c489223f1"}],"metadataStatus":"canonical","oracleSnapshotAt":"2026-09-12T05:32:17.946882+00:00","candidate":false},{"id":"3cd7ef87-4cb4-42ff-842f-e9a465dab165","key":"roil-cartographer","name":"Roil Cartographer","manaCost":"{1}{U}","manaValue":2,"typeLine":"Creature — Merfolk Rogue","types":["Creature"],"subtypes":["Merfolk","Rogue"],"supertypes":[],"oracleText":"Landfall — Whenever a land you control enters, you get {E} (an energy counter).\n{T}, Pay six {E}: Draw three cards.","colors":["U"],"colorIdentity":["U"],"keywords":["Landfall"],"power":"1","toughness":"3","loyalty":null,"defense":null,"layout":"normal","faces":[],"image":"assets/cards/3cd7ef87-4cb4-42ff-842f-e9a465dab165.jpg","backImage":null,"printId":"84317f9d-5a24-4f74-9c3e-0a8b5c15bb5f","set":"mh3","collectorNumber":"67","source":"https://scryfall.com/card/mh3/67/roil-cartographer?utm_source=api","rulings":[{"object":"ruling","oracle_id":"3cd7ef87-4cb4-42ff-842f-e9a465dab165","source":"wotc","published_at":"2024-11-08","comment":"A landfall ability triggers whenever a land you control enters for any reason. It triggers whenever you play a land, as well as whenever a spell or ability puts a land onto the battlefield under your control."},{"object":"ruling","oracle_id":"3cd7ef87-4cb4-42ff-842f-e9a465dab165","source":"wotc","published_at":"2024-11-08","comment":"A landfall ability doesn't trigger if a permanent already on the battlefield becomes a land."},{"object":"ruling","oracle_id":"3cd7ef87-4cb4-42ff-842f-e9a465dab165","source":"wotc","published_at":"2024-11-08","comment":"Whenever a land you control enters, each landfall ability of the permanents you control will trigger. You can put them   on the stack in any order. The last ability you put on the stack will be the first one to resolve (As a result, you can have those abilities resolve in the order of your choosing.)."},{"object":"ruling","oracle_id":"3cd7ef87-4cb4-42ff-842f-e9a465dab165","source":"wotc","published_at":"2024-06-07","comment":"If an effect says you get one or more {E}, you get that many energy counters. To pay one or more {E}, you lose that many energy counters. You can't pay more energy counters than you have. Any effects that interact with counters a player gets, has, or loses can interact with energy counters."},{"object":"ruling","oracle_id":"3cd7ef87-4cb4-42ff-842f-e9a465dab165","source":"wotc","published_at":"2024-06-07","comment":"Energy counters aren't mana. They don't go away as steps, phases, and turns end, and effects that add mana \"of any type\" can't give you energy counters."},{"object":"ruling","oracle_id":"3cd7ef87-4cb4-42ff-842f-e9a465dab165","source":"wotc","published_at":"2024-06-07","comment":"Some triggered abilities state that you \"may pay\" a certain amount of {E}. You can't pay that amount multiple times to multiply the effect. You simply choose whether or not to pay that amount of {E} as the ability resolves."},{"object":"ruling","oracle_id":"3cd7ef87-4cb4-42ff-842f-e9a465dab165","source":"wotc","published_at":"2024-06-07","comment":"{E} is the energy symbol. It represents one energy counter."},{"object":"ruling","oracle_id":"3cd7ef87-4cb4-42ff-842f-e9a465dab165","source":"wotc","published_at":"2024-06-07","comment":"If a spell or ability with one or more targets states that you \"may pay\" some amount of {E}, and each permanent that it targets has become an illegal target, the spell or ability won't resolve. You can't pay any {E} even if you want to."},{"object":"ruling","oracle_id":"3cd7ef87-4cb4-42ff-842f-e9a465dab165","source":"wotc","published_at":"2024-06-07","comment":"Some spells and abilities that give you {E} may require targets. If each target chosen is an illegal target as that spell or ability tries to resolve, it won't resolve. You won't get any {E}."},{"object":"ruling","oracle_id":"3cd7ef87-4cb4-42ff-842f-e9a465dab165","source":"wotc","published_at":"2024-06-07","comment":"Some triggered abilities that state that you \"may pay\" a certain amount of {E} describe an effect that happens \"If you do.\" In that case, no player may take actions to try to stop the ability's effect after you make your choice. If the payment is followed by the phrase \"When you do,\" then you'll choose any targets for that reflexive triggered ability and put it on the stack before players can take actions."},{"object":"ruling","oracle_id":"3cd7ef87-4cb4-42ff-842f-e9a465dab165","source":"wotc","published_at":"2024-06-07","comment":"Energy counters are a kind of counter that a player may have. They're not associated with any specific permanents."},{"object":"ruling","oracle_id":"3cd7ef87-4cb4-42ff-842f-e9a465dab165","source":"wotc","published_at":"2024-06-07","comment":"Keep track of how many energy counters each player has. Potential ways to track this include writing theme down on paper or using dice, but any method that is clear and mutually agreeable is fine. (At higher levels of tournament play, dice may not be allowed for tracking counters that players have.)"}],"related":[{"object":"related_card","id":"7b9b743b-340d-4a15-a71d-d3108adbdc45","component":"combo_piece","name":"Roil Cartographer","type_line":"Creature — Merfolk Rogue","uri":"https://api.scryfall.com/cards/7b9b743b-340d-4a15-a71d-d3108adbdc45"},{"object":"related_card","id":"1c516212-ad39-4396-8e05-ae57f100309f","component":"combo_piece","name":"Energy Reserve","type_line":"Card","uri":"https://api.scryfall.com/cards/1c516212-ad39-4396-8e05-ae57f100309f"}],"metadataStatus":"canonical","oracleSnapshotAt":"2026-09-12T05:32: on:-bahamut?utm_source=api","rulings":[{"object":"ruling","oracle_id":"fe9f6825-597b-4d80-ab7c-f4ee4e824b6f","source":"wotc","published_at":"2025-06-06","comment":"Use the total mana value of other permanents you control as Summon: Bahamut's fourth chapter ability resolves to determine how much damage is dealt."},{"object":"ruling","oracle_id":"fe9f6825-597b-4d80-ab7c-f4ee4e824b6f","source":"wotc","published_at":"2025-06-06","comment":"A chapter ability doesn't trigger if a lore counter is put on a Saga that already had a number of lore counters greater than or equal to that chapter's number. For example, the third lore counter put on a Saga causes the chapter III ability to trigger, but chapters I and II won't trigger again."},{"object":"ruling","oracle_id":"fe9f6825-597b-4d80-ab7c-f4ee4e824b6f","source":"wotc","published_at":"2025-06-06","comment":"If multiple chapter abilities trigger at the same time, their controller puts them on the stack in any order. If any of them require targets, those targets are chosen as you put the abilities on the stack, before any of those abilities resolve."},{"object":"ruling","oracle_id":"fe9f6825-597b-4d80-ab7c-f4ee4e824b6f","source":"wotc","published_at":"2025-06-06","comment":"As a Saga enters, its controller puts a lore counter on it. As your first main phase begins (immediately after your draw step), you put another lore counter on each Saga you control. Putting a lore counter on a Saga in either of these ways doesn't use the stack."},{"object":"ruling","oracle_id":"fe9f6825-597b-4d80-ab7c-f4ee4e824b6f","source":"wotc","published_at":"2025-06-06","comment":"If a permanent you control has {X} in its mana cost, X is 0 for the purpose of determining its mana value."},{"object":"ruling","oracle_id":"fe9f6825-597b-4d80-ab7c-f4ee4e824b6f","source":"wotc","published_at":"2025-06-06","comment":"Due to a rules change that takes effect with this release (see below for details), a Saga that somehow loses all of its chapter abilities will not be sacrificed as a state-based action. It will also not gain a lore counter at the beginning of each of its controller's first main phases."},{"object":"ruling","oracle_id":"fe9f6825-597b-4d80-ab7c-f4ee4e824b6f","source":"wotc","published_at":"2025-06-06","comment":"Once a chapter ability has triggered, the ability on the stack won't be affected if the Saga gains or loses counters, or if it leaves the battlefield."},{"object":"ruling","oracle_id":"fe9f6825-597b-4d80-ab7c-f4ee4e824b6f","source":"wotc","published_at":"2025-06-06","comment":"The mana value of a nonmodal double-faced permanent is the mana value of its front face, no matter which face is up."},{"object":"ruling","oracle_id":"fe9f6825-597b-4d80-ab7c-f4ee4e824b6f","source":"wotc","published_at":"2025-06-06","comment":"Saga creatures have two sections to their text boxes. The first section, above the type line, contains their chapter abilities, and the second section, below the type line, contains any other abilities (or italicized flavor text). Any abilities in the latter section aren't chapter abilities and apply no matter how many lore counters are on the creature."},{"object":"ruling","oracle_id":"fe9f6825-597b-4d80-ab7c-f4ee4e824b6f","source":"wotc","published_at":"2025-06-06","comment":"Removing lore counters won't cause a previous chapter ability to trigger. If lore counters are removed from a Saga, the appropriate chapter abilities will trigger again when the Saga receives more lore counters."},{"object":"ruling","oracle_id":"fe9f6825-597b-4d80-ab7c-f4ee4e824b6f","source":"wotc","published_at":"2025-06-06","comment":"Each symbol on the left of a Saga's text box represents a chapter ability. A chapter ability is a triggered ability that triggers when a lore counter that is put on the Saga causes the number of lore counters on the Saga to become equal to or greater than the ability's chapter number. Chapter abilities are put onto the stack and may be responded to."},{"object":"ruling","oracle_id":"fe9f6825-597b-4d80-ab7c-f4ee4e824b6f","source":"wotc","published_at":"2025-06-06","comment":"Once the number of lore counters on a Saga is greater than or equal to the greatest number among its chapter abilities, the Saga's controller sacrifices it as soon as its chapter ability has left the stack, most likely by resolving or being countered. This state-based action doesn't use the stack."}],"related":[],"metadataStatus":"canonical","oracleSnapshotAt":"2026-09-12T05:32:39.981501+00:00","candidate":true},{"id":"29cd8a7c-108a-43d1-af63-f603a27c24f2","key":"tanglepool-bridge","name":"Tanglepool Bridge","manaCost":"","manaValue":0,"typeLine":"Artifact Land","types":["Artifact","Land"],"subtypes":[],"supertypes":[],"oracleText":"This land enters tapped.\nIndestructible\n{T}: Add {G} or {U}.","colors":[],"colorIdentity":["G","U"],"keywords":["Indestructible"],"power":null,"toughness":null,"loyalty":null,"defense":null,"layout":"normal","faces":[],"image":"assets/cards/29cd8a7c-108a-43d1-af63-f603a27c24f2.jpg","backImage":null,"printId":"57d2b895-8921-4615-a674-fb85eed5ea3f","set":"mh2","collectorNumber":"257","source":"https://scryfall.com/card/mh2/257/tanglepool-bridge?utm_source=api","rulings":[],"related":[],"metadataStatus":"canonical","oracleSnapshotAt":"2026-09-12T05:32:40.664153+00:00","candidate":true},{"id":"0715e860-3b3b-4331-9718-207973e94fee","key":"tatyova-benthic-druid","name":"Tatyova, Benthic Druid","manaCost":"{3}{G}{U}","manaValue":5,"typeLine":"Legendary Creature — Merfolk Druid","types":["Creature"],"subtypes":["Merfolk","Druid"],"supertypes":["Legendary"],"oracleText":"Landfall — Whenever a land you control enters, you gain 1 life and draw a card.","colors":["G","U"],"colorIdentity":["G","U"],"keywords":["Landfall"],"power":"3","toughness":"3","loyalty":null,"defense":null,"layout":"normal","faces":[],"image":"assets/cards/0715e860-3b3b-4331-9718-207973e94fee.jpg","backImage":null,"printId":"eabc978a-0666-472d-bdc6-d4b29d29eca4","set":"fdn","collectorNumber":"247","source":"https://scryfall.com/card/fdn/247/tatyova-benthic-druid?utm_source=api","rulings":[{"object":"ruling","oracle_id":"0715e860-3b3b-4331-9718-207973e94fee","source":"wotc","published_at":"2024-11-08","comment":"A landfall ability triggers whenever a land you control enters for any reason. It triggers whenever you play a land, as well as whenever a spell or ability puts a land onto the battlefield under your control."},{"object":"ruling","oracle_id":"0715e860-3b3b-4331-9718-207973e94fee","source":"wotc","published_at":"2024-11-08","comment":"A landfall ability doesn't trigger if a permanent already on the battlefield becomes a land."},{"object":"ruling","oracle_id":"0715e860-3b3b-4331-9718-207973e94fee","source":"wotc","published_at":"2024-11-08","comment":"Whenever a land you control enters, each landfall ability of the permanents you control will trigger. You can put them   on the stack in any order. The last ability you put on the stack will be the first one to resolve (As a result, you can have those abilities resolve in the order of your choosing.)."}],"related":[],"metadataStatus":"canonical","oracleSnapshotAt":"2026-09-12T05:32:41.325426+00:00","candidate":true},{"id":"4aeafdf3-7828-4114-8c74-3bd46357caec","key":"tezzeret-the-seeker","name":"Tezzeret the Seeker","manaCost":"{3}{U}{U}","manaValue":5,"typeLine":"Legendary Planeswalker — Tezzeret","types":["Planeswalker"],"subtypes":["Tezzeret"],"supertypes":["Legendary"],"oracleText":"+1: Untap up to two target artifacts.\n−X: Search your library for an artifact card with mana value X or less, put it onto the battlefield, then shuffle.\n−5: Artifacts you control become artifact creatures with base power and toughness 5/5 until end of turn.","colors":["U"],"colorIdentity":["U"],"keywords":[],"power":null,"toughness":null,"loyalty":"4","defense":null,"layout":"normal","faces":[],"image":"assets/cards/4aeafdf3-7828-4114-8c74-3bd46357caec.jpg","backImage":null,"printId":"cf339735-eb1a-46f0-8c bject":"ruling","oracle_id":"4aeafdf3-7828-4114-8c74-3bd46357caec","source":"wotc","published_at":"2008-10-01","comment":"The third ability affects all artifacts you control, including artifacts that are already creatures."},{"object":"ruling","oracle_id":"4aeafdf3-7828-4114-8c74-3bd46357caec","source":"wotc","published_at":"2008-10-01","comment":"The third ability causes artifacts you control to become creatures in addition to their other card types."}],"related":[],"metadataStatus":"canonical","oracleSnapshotAt":"2026-09-12T05:32:41.987493+00:00","candidate":true},{"id":"0eb11b2d-a397-48da-a0f3-9f0f83f42282","key":"tezzeret-cruel-captain","name":"Tezzeret, Cruel Captain","manaCost":"{3}","manaValue":3,"typeLine":"Legendary Planeswalker — Tezzeret","types":["Planeswalker"],"subtypes":["Tezzeret"],"supertypes":["Legendary"],"oracleText":"Whenever an artifact you control enters, put a loyalty counter on Tezzeret.\n0: Untap target artifact or creature. If it's an artifact creature, put a +1/+1 counter on it.\n−3: Search your library for an artifact card with mana value 1 or less, reveal it, put it into your hand, then shuffle.\n−7: You get an emblem with \"At the beginning of combat on your turn, put three +1/+1 counters on target artifact you control. If it's not a creature, it becomes a 0/0 Robot artifact creature.\"","colors":[],"colorIdentity":[],"keywords":[],"power":null,"toughness":null,"loyalty":"4","defense":null,"layout":"normal","faces":[],"image":"assets/cards/0eb11b2d-a397-48da-a0f3-9f0f83f42282.jpg","backImage":null,"printId":"02e8e540-8aa3-4e6a-9a11-c3949cab5f0f","set":"eoe","collectorNumber":"2","source":"https://scryfall.com/card/eoe/2/tezzeret-cruel-captain?utm_source=api","rulings":[{"object":"ruling","oracle_id":"0eb11b2d-a397-48da-a0f3-9f0f83f42282","source":"wotc","published_at":"2025-07-25","comment":"If the emblem’s ability causes a Vehicle to become an artifact creature, its base power and toughness will be set to 0/0. Crewing that Vehicle will not restore its power and toughness. Similarly, if the ability causes a permanent with station to become an artifact creature, putting an amount of charge counters on it greater than or equal to the amount required for it to become an artifact creature won’t overwrite the base power and toughness set by the emblem’s ability."},{"object":"ruling","oracle_id":"0eb11b2d-a397-48da-a0f3-9f0f83f42282","source":"wotc","published_at":"2025-07-25","comment":"If a card in your library has {X} in its mana cost, X is 0 for the purpose of determining its mana value."},{"object":"ruling","oracle_id":"0eb11b2d-a397-48da-a0f3-9f0f83f42282","source":"wotc","published_at":"2025-07-25","comment":"The resulting artifact creature will be able to attack if it’s been under your control continuously since the turn began. That is, it doesn’t matter how long it’s been a creature, just how long it’s been on the battlefield."},{"object":"ruling","oracle_id":"0eb11b2d-a397-48da-a0f3-9f0f83f42282","source":"wotc","published_at":"2025-07-25","comment":"The emblem’s triggered ability doesn’t remove any abilities, types, subtypes, or supertypes the artifact has."},{"object":"ruling","oracle_id":"0eb11b2d-a397-48da-a0f3-9f0f83f42282","source":"wotc","published_at":"2025-07-25","comment":"If the emblem’s ability causes a Vehicle to become an artifact creature, it doesn’t count as “crewing” that Vehicle for any ability that would trigger due to a Vehicle becoming crewed."}],"related":[{"object":"related_card","id":"5cf53baa-b0c3-4190-a5c6-c141d54cff32","component":"combo_piece","name":"Tezzeret, Cruel Captain","type_line":"Legendary Planeswalker — Tezzeret","uri":"https://api.scryfall.com/cards/5cf53baa-b0c3-4190-a5c6-c141d54cff32"},{"object":"related_card","id":"b97ae026-a3d3-4130-bf6f-aeeb3a1ab520","component":"combo_piece","name":"Tezzeret, Cruel Captain Emblem","type_line":"Emblem","uri":"https://api.scryfall.com/cards/b97ae026-a3d3-4130-bf6f-aeeb3a1ab520"}],"metadataStatus":"canonical","oracleS
