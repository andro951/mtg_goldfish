/+1 counter on it and draw a card.","colors":["G"],"colorIdentity":["G"],"keywords":[],"power":null,"toughness":null,"loyalty":null,"defense":null,"layout":"normal","faces":[],"image":"assets/cards/78427103-9543-41fb-b6d4-72963fe87275.jpg","backImage":null,"printId":"6340e0f3-7f9c-4d71-8daf-e1be5505eb5b","set":"cmm","collectorNumber":"294","source":"https://scryfall.com/card/cmm/294/the-great-henge?utm_source=api","rulings":[{"object":"ruling","oracle_id":"78427103-9543-41fb-b6d4-72963fe87275","source":"wotc","published_at":"2025-10-02","comment":"Once you announce that you're casting a spell, no player may take actions until the spell has been paid for. Notably, opponents can't try to change by how much The Great Henge's cost is reduced."},{"object":"ruling","oracle_id":"78427103-9543-41fb-b6d4-72963fe87275","source":"wotc","published_at":"2025-10-02","comment":"The first step of casting a spell is to move it to the stack. If this causes the greatest power among creatures you control to change, that new power will be used to determine the cost reduction."},{"object":"ruling","oracle_id":"78427103-9543-41fb-b6d4-72963fe87275","source":"wotc","published_at":"2025-10-02","comment":"The cost reduction ability reduces only the generic mana in The Great Henge's cost. The colored mana must still be paid."},{"object":"ruling","oracle_id":"78427103-9543-41fb-b6d4-72963fe87275","source":"wotc","published_at":"2025-10-02","comment":"Once The Great Henge's last ability has triggered, you'll draw a card even if you can't put a +1/+1 counter on the creature for some reason (most likely because it has left the battlefield)."},{"object":"ruling","oracle_id":"78427103-9543-41fb-b6d4-72963fe87275","source":"wotc","published_at":"2025-10-02","comment":"Once you determine the cost to cast The Great Henge, you may activate mana abilities to pay that cost. If the greatest power among creatures you control changes while activating mana abilities, the cost to cast The Great Henge remains what you previously determined."},{"object":"ruling","oracle_id":"78427103-9543-41fb-b6d4-72963fe87275","source":"wotc","published_at":"2025-10-02","comment":"To determine the total cost of a spell, start with the mana cost or alternative cost you're paying, add any cost increases, then apply any cost reductions. The mana value of the spell remains unchanged, no matter what the total cost to cast it was."}],"related":[],"metadataStatus":"canonical","oracleSnapshotAt":"2026-09-12T05:32:44.642165+00:00","candidate":true},{"id":"c396db03-bf11-4e20-b630-4f9aa8fd78da","key":"the-mightstone-and-weakstone","name":"The Mightstone and Weakstone","manaCost":"{5}","manaValue":5,"typeLine":"Legendary Artifact — Powerstone","types":["Artifact"],"subtypes":["Powerstone"],"supertypes":["Legendary"],"oracleText":"When The Mightstone and Weakstone enters, choose one —\n• Draw two cards.\n• Target creature gets -5/-5 until end of turn.\n{T}: Add {C}{C}. This mana can't be spent to cast nonartifact spells.\n(Melds with Urza, Lord Protector.)","colors":[],"colorIdentity":[],"keywords":[],"power":null,"toughness":null,"loyalty":null,"defense":null,"layout":"meld","faces":[],"image":"assets/cards/c396db03-bf11-4e20-b630-4f9aa8fd78da.jpg","backImage":null,"printId":"02aea379-b444-46a3-82f4-3038f698d4f4","set":"bro","collectorNumber":"238","source":"https://scryfall.com/card/bro/238/the-mightstone-and-weakstone?utm_source=api","rulings":[{"object":"ruling","oracle_id":"c396db03-bf11-4e20-b630-4f9aa8fd78da","source":"wotc","published_at":"2022-10-14","comment":"When a pair of cards are melded, the result is a single creature that's represented by two cards. If the melded creature dies, both cards are put into your graveyard. As it leaves the battlefield, both of those cards are turned face up again. If the cards are put on the top or bottom of your library, you choose their relative order."},{"object":"ruling","oracle_id":"c396db03-bf11-4e20-b630-4f9aa8fd78da","source":"wotc","published_at":"2022-10-14","comment":"One card in each pair of meld cards has an ability that instructs you to exile the two cards and meld them. If you control more than one object with one of those names, you select one object with that name to exile."},{"object":"ruling","oracle_id":"c396db03-bf11-4e20-b630-4f9aa8fd78da","source":"wotc","published_at":"2022-10-14","comment":"When two cards are exiled and melded, they each leave the battlefield, then return together as one new object with no relation to either of the objects that left the battlefield. Counters, Auras, Equipment, and other effects that affected those two cards don't affect the melded permanent."},{"object":"ruling","oracle_id":"c396db03-bf11-4e20-b630-4f9aa8fd78da","source":"wotc","published_at":"2022-10-14","comment":"Only two cards belonging to the same meld pair can be melded. Tokens, cards that aren't meld cards, or meld cards that don't form a meld pair can't be melded. If an effect instructs a player to meld cards that can't be melded, those cards remain in exile."},{"object":"ruling","oracle_id":"c396db03-bf11-4e20-b630-4f9aa8fd78da","source":"wotc","published_at":"2022-10-14","comment":"While a meld card is in any zone other than the battlefield, it has only the characteristics of its front face. The same is true while it's on the battlefield with its front face up."},{"object":"ruling","oracle_id":"c396db03-bf11-4e20-b630-4f9aa8fd78da","source":"wotc","published_at":"2022-10-14","comment":"While a melded permanent is on the battlefield, it has only the characteristics of its combined back face. Any effects that modify how the new object enters the battlefield will consider only the combined back face."},{"object":"ruling","oracle_id":"c396db03-bf11-4e20-b630-4f9aa8fd78da","source":"wotc","published_at":"2022-10-14","comment":"Note that the permanent represented by the combined back faces has a color indicator."},{"object":"ruling","oracle_id":"c396db03-bf11-4e20-b630-4f9aa8fd78da","source":"wotc","published_at":"2022-10-14","comment":"The mana value of a melded permanent is the sum of the mana values of its front faces. A creature that becomes a copy of a melded permanent has only the characteristics of that combined back face, and its mana value is 0."},{"object":"ruling","oracle_id":"c396db03-bf11-4e20-b630-4f9aa8fd78da","source":"wotc","published_at":"2022-10-14","comment":"A player prompted to name a card may name the combined back face, and each player has the right to know that combined back face's characteristics at all times."},{"object":"ruling","oracle_id":"c396db03-bf11-4e20-b630-4f9aa8fd78da","source":"wotc","published_at":"2022-10-14","comment":"If an effect moves a melded permanent to a new zone and then affects \"that card,\" it affects both cards."},{"object":"ruling","oracle_id":"c396db03-bf11-4e20-b630-4f9aa8fd78da","source":"wotc","published_at":"2022-10-14","comment":"In the Commander variant, a meld card's color identity is determined only by the mana costs and mana symbols in the rules text of its front face. No symbols or rules text of the permanent it melds into are considered."}],"related":[{"object":"related_card","id":"40a01679-3224-427e-bd1d-b797b0ab68b7","component":"meld_result","name":"Urza, Planeswalker","type_line":"Legendary Planeswalker — Urza","uri":"https://api.scryfall.com/cards/40a01679-3224-427e-bd1d-b797b0ab68b7"},{"object":"related_card","id":"02aea379-b444-46a3-82f4-3038f698d4f4","component":"meld_part","name":"The Mightstone and Weakstone","type_line":"Legendary Artifact — Powerstone","uri":"https://api.scryfall.com/cards/02aea379-b444-46a3-82f4-3038f698d4f4"},{"object":"related_card","id":"8aefe8bd-216a-4ec1-9362-3f9dbf7fd083","component":"meld_part","name":"Urza, Lord Protector","type_line":"Legendary Creature — Human Artificer","uri":"https://api.scryfall.com/cards/8aefe8bd-216a-4ec1-9362-3f9dbf7fd083"}],"metadataStatus":"canonical","oracleSnapshotAt":"2026-09-12T05:32:45.313415+00:00","candidate":true},{"id":"03f5c566-825c-4c46-9c01-a2f9b1e70a13","key":"the-mycosynth-gardens","name":"The Mycosynth Gardens","manaCost":"","manaValue":0,"typeLine":"Land — Sphere","types":["Land"],"subtypes":["Sphere"],"supertypes":[],"oracleText":"{T}: Add {C}.\n{1}, {T}: Add one mana of any color.\n{X}, {T}: This land becomes a copy of target nontoken artifact you control with mana value X.","colors":[],"colorIdentity":[],"keywords":[],"power":null,"toughness":null,"loyalty":null,"defense":null,"layout":"normal","faces":[],"image":"assets/cards/03f5c566-825c-4c46-9c01-a2f9b1e70a13.jpg","backImage":null,"printId":"0a6f0408-6758-495f-9d6c-7686a1542fbd","set":"eoc","collectorNumber":"168","source":"https://scryfall.com/card/eoc/168/the-mycosynth-gardens?utm_source=api","rulings":[{"object":"ruling","oracle_id":"03f5c566-825c-4c46-9c01-a2f9b1e70a13","source":"wotc","published_at":"2023-02-04","comment":"The Mycosynth Gardens copies exactly what was printed on the original artifact and nothing else (unless that permanent is copying something else; see below). It doesn't copy whether that artifact is tapped or untapped, whether it has any counters on it or Auras and Equipment attached to it, and so on."},{"object":"ruling","oracle_id":"03f5c566-825c-4c46-9c01-a2f9b1e70a13","source":"wotc","published_at":"2023-02-04","comment":"If the copied artifact is copying something else, then The Mycosynth Gardens becomes a copy of whatever that artifact copied."},{"object":"ruling","oracle_id":"03f5c566-825c-4c46-9c01-a2f9b1e70a13","source":"wotc","published_at":"2023-02-04","comment":"If the copied artifact has {X} in its mana cost, X is 0."}],"related":[],"metadataStatus":"canonical","oracleSnapshotAt":"2026-09-12T05:32:45.960223+00:00","candidate":true},{"id":"3aa83ed2-f48b-4ce6-a614-2c54ddf50538","key":"the-one-ring","name":"The One Ring","manaCost":"{4}","manaValue":4,"typeLine":"Legendary Artifact","types":["Artifact"],"subtypes":[],"supertypes":["Legendary"],"oracleText":"Indestructible\nWhen The One Ring enters, if you cast it, you gain protection from everything until your next turn.\nAt the beginning of your upkeep, you lose 1 life for each burden counter on The One Ring.\n{T}: Put a burden counter on The One Ring, then draw a card for each burden counter on The One Ring.","colors":[],"colorIdentity":[],"keywords":["Indestructible"],"power":null,"toughness":null,"loyalty":null,"defense":null,"layout":"normal","faces":[],"image":"assets/cards/3aa83ed2-f48b-4ce6-a614-2c54ddf50538.jpg","backImage":null,"printId":"d5806e68-1054-458e-866d-1f2470f682b2","set":"ltr","collectorNumber":"246","source":"https://scryfall.com/card/ltr/246/the-one-ring?utm_source=api","rulings":[{"object":"ruling","oracle_id":"3aa83ed2-f48b-4ce6-a614-2c54ddf50538","source":"wotc","published_at":"2023-06-16","comment":"Gaining protection from everything causes a spell or ability on the stack to have an illegal target if it targets you. As a spell or ability tries to resolve, if all its targets are illegal, that spell or ability doesn't resolve and none of its effects happen, including effects unrelated to the target. If at least one target is still legal, the spell or ability does as much as it can to the remaining legal targets, and its other effects still happen."},{"object":"ruling","oracle_id":"3aa83ed2-f48b-4ce6-a614-2c54ddf50538","source":"wotc","published_at":"2023-06-16","comment":"If a player has protection from everything, it means three things: 1) All damage that would be dealt to that player is prevented. 2) Auras can't be attached to that player. 3) That player can't be the target of spells or abilities."},{"object":"ruling","oracle_id":"3aa83ed2-f48b-4ce6-a614-2c54ddf50538","source":"wotc","published_at":"2023-06-16","comment":"Protection from everything will usually prevent damage if it would be dealt to you, but some damage can't be prevented. In this case, that damage reduces your life total as normal."},{"object":"ruling","oracle_id":"3aa83ed2-f48b-4ce6-a614-2c54ddf50538","source":"wotc","published_at":"2023-06-16","comment":"Nothing other than the specified events are prevented or illegal. An effect that doesn't target you could still cause you to discard cards, for example. Creatures can still attack you while you have protection from everything, although combat damage that they would deal to you will be prevented."}],"related":[{"object":"related_card","id":"6e817a37-235f-46fd-b857-9003b2264d10","component":"combo_piece","name":"The One Ring","type_line":"Legendary Artifact","uri":"https://api.scryfall.com/cards/6e817a37-235f-46fd-b857-9003b2264d10"},{"object":"related_card","id":"23b91af8-eff9-402a-8ba8-ab470c5c1a44","component":"combo_piece","name":"A-The One Ring","type_line":"Legendary Artifact","uri":"https://api.scryfall.com/cards/23b91af8-eff9-402a-8ba8-ab470c5c1a44"}],"metadataStatus":"canonical","oracleSnapshotAt":"2026-09-12T05:32:46.620507+00:00","candidate":true},{"id":"751f22bc-bcea-4213-a37b-b5f72448a4c4","key":"the-reality-chip","name":"The Reality Chip","manaCost":"{1}{U}","manaValue":2,"typeLine":"Legendary Artifact Creature — Equipment Jellyfish","types":["Artifact","Creature"],"subtypes":["Equipment","Jellyfish"],"supertypes":["Legendary"],"oracleText":"You may look at the top card of your library any time.\nAs long as The Reality Chip is attached to a creature, you may play lands and cast spells from the top of your library.\nReconfigure {2}{U} ({2}{U}: Attach to target creature you control; or unattach from a creature. Reconfigure only as a sorcery. While attached, this isn't a creature.)","colors":["U"],"colorIdentity":["U"],"keywords":["Reconfigure"],"power":"0","toughness":"4","loyalty":null,"defense":null,"layout":"normal","faces":[],"image":"assets/cards/751f22bc-bcea-4213-a37b-b5f72448a4c4.jpg","backImage":null,"printId":"d859de3a-0be1-4e66-b438-1c3d4ee756cd","set":"neo","collectorNumber":"74","source":"https://scryfall.com/card/neo/74/the-reality-chip?utm_source=api","rulings":[{"object":"ruling","oracle_id":"751f22bc-bcea-4213-a37b-b5f72448a4c4","source":"wotc","published_at":"2022-02-18","comment":"You must pay all costs and follow all timing rules for cards played from the top of your library this way. For example, you may play a land this way only while the stack is empty during one of your own main phases, and only if you haven't played a land yet this turn."},{"object":"ruling","oracle_id":"751f22bc-bcea-4213-a37b-b5f72448a4c4","source":"wotc","published_at":"2022-02-18","comment":"Once you cast a spell from the top of your library, causing The Reality Chip to no longer be attached to a creature will have no effect on that spell."},{"object":"ruling","oracle_id":"751f22bc-bcea-4213-a37b-b5f72448a4c4","source":"wotc","published_at":"2022-02-18","comment":"The top card of your library is still in your library and not in your hand. You can't discard cards from the top of your library (for example, to activate their channel abilities)."},{"object":"ruling","oracle_id":"751f22bc-bcea-4213-a37b-b5f72448a4c4","source":"wotc","published_at":"2022-02-18","comment":"Reconfigure represents two activated abilities. Reconfigure [cost] means “[Cost]: Attach this permanent to another target creature you control. Activate only as a sorcery,” and “[Cost]: Unattach this permanent. Activate only if this permanent is attached to a creature and only as a sorcery.”"},{"object":"ruling","oracle_id":"751f22bc-bcea-4213-a37b-b5f72448a4c4","source":"wotc","published_at":"2022-02-18","comment":"Attaching an Equipment with reconfigure to a creature causes that Equipment to stop being a creature until it becomes unattached. It also loses any creature subtypes it had."},{"object":"ruling","oracle_id":"751f22bc-bcea-4213-a37b-b5f72448a4c4","source":"wotc","published_at":"2022-02-18","comment":"An Equipment doesn't become tapped when the permanent it's attached to becomes tapped. For example, if you attack with a creature that is equipped with Acquisition Octopus, then use reconfigure to unattach Acquisition Octopus after combat, the Octopus will be untapped and could be used to block during your opponent's turn."},{"object":"ruling","oracle_id":"751f22bc-bcea-4213-a37b-b5f72448a4c4","source":"wotc","published_at":"2022-02-18","comment":"Similarly, if an Equipment is tapped, its reconfigure abilities may still be activated and it may still become attached to creatures. Becoming attached doesn't untap it. In most cases, an attached Equipment being tapped won't affect gameplay, but it will be relevant if it becomes unattached again before it untaps."},{"object":"ruling","oracle_id":"751f22bc-bcea-4213-a37b-b5f72448a4c4","source":"wotc","published_at":"2022-02-18","comment":"If an Equipment with reconfigure somehow loses its abilities while it is attached, the effect causing it to not be a creature continues to apply until it becomes unattached."},{"object":"ruling","oracle_id":"751f22bc-bcea-4213-a37b-b5f72448a4c4","source":"wotc","published_at":"2022-02-18","comment":"As soon as an Equipment creature with reconfigure stops being a creature, any Equipment and Auras with enchant creature abilities become unattached. Auras that can enchant an Equipment that isn't a creature remain attached to it."},{"object":"ruling","oracle_id":"751f22bc-bcea-4213-a37b-b5f72448a4c4","source":"wotc","published_at":"2022-02-18","comment":"An Equipment creature with reconfigure can be attached to creatures by effects other than its reconfigure ability, such as the activated ability of Brass Squire."},{"object":"ruling","oracle_id":"751f22bc-bcea-4213-a37b-b5f72448a4c4","source":"wotc","published_at":"2022-02-18","comment":"Although it causes an Equipment to become attached to a creature, reconfigure is not an “equip ability” for the purpose of cards like Fighter Class and Leonin Shikari."},{"object":"ruling","oracle_id":"751f22bc-bcea-4213-a37b-b5f72448a4c4","source":"wotc","published_at":"2022-02-18","comment":"An Equipment creature can never become attached to itself. If an effect tries to do this, nothing happens."},{"object":"ruling","oracle_id":"751f22bc-bcea-4213-a37b-b5f72448a4c4","source":"wotc","published_at":"2022-02-18","comment":"If a permanent with reconfigure is somehow still a creature after it becomes attached (perhaps due to an effect like that of March of the Machines), it immediately becomes unattached from the equipped creature."}],"related":[],"metadataStatus":"canonical","oracleSnapshotAt":"2026-09-12T05:32:47.294606+00:00","candidate":true},{"id":"a6bcec1f-f515-4e63-9e84-8eb04cc582ff","key":"the-seriema","name":"The Seriema","manaCost":"{1}{W}{W}","manaValue":3,"typeLine":"Legendary Artifact — Spacecraft","types":["Artifact"],"subtypes":["Spacecraft"],"supertypes":["Legendary"],"oracleText":"When The Seriema enters, search your library for a legendary creature card, reveal it, put it into your hand, then shuffle.\nStation (Tap another creature you control: Put charge counters equal to its power on this Spacecraft. Station only as a sorcery. It's an artifact creature at 7+.)\n7+ | Flying\nOther tapped legendary creatures you control have indestructible.","colors":["W"],"colorIdentity":["W"],"keywords":["Station"],"power":"5","toughness":"5","loyalty":null,"defense":null,"layout":"normal","faces":[],"image":"assets/cards/a6bcec1f-f515-4e63-9e84-8eb04cc582ff.jpg","backImage":null,"printId":"dec91ec3-42d3-4922-96f0-dbb50a576084","set":"eoe","collectorNumber":"35","source":"https://scryfall.com/card/eoe/35/the-seriema?utm_source=api","rulings":[],"related":[],"metadataStatus":"canonical","oracleSnapshotAt":"2026-09-12T05:32:47.943147+00:00","candidate":true},{"id":"e6e6e3d2-f2fb-46a1-8798-13a2f2efe8cc","key":"the-wandering-minstrel","name":"The Wandering Minstrel","manaCost":"{G}{U}","manaValue":2,"typeLine":"Legendary Creature — Human Bard","types":["Creature"],"subtypes":["Human","Bard"],"supertypes":["Legendary"],"oracleText":"Lands you control enter untapped.\nThe Minstrel's Ballad — At the beginning of combat on your turn, if you control five or more Towns, create a 2/2 Elemental creature token that's all colors.\n{3}{W}{U}{B}{R}{G}: Other creatures you control get +X/+X until end of turn, where X is the number of Towns you control.","colors":["G","U"],"colorIdentity":["B","G","R","U","W"],"keywords":[],"power":"1","toughness":"3","loyalty":null,"defense":null,"layout":"normal","faces":[],"image":"assets/cards/e6e6e3d2-f2fb-46a1-8798-13a2f2efe8cc.jpg","backImage":null,"printId":"77bc419d-ff69-4e7c-afe6-faca383a5ed7","set":"fin","collectorNumber":"249","source":"https://scryfall.com/card/fin/249/the-wandering-minstrel?utm_source=api","rulings":[{"object":"ruling","oracle_id":"e6e6e3d2-f2fb-46a1-8798-13a2f2efe8cc","source":"wotc","published_at":"2025-06-06","comment":"The Wandering Minstrel's second ability checks at the moment it would trigger to see if you control five or more Towns. If you don't, the ability won't trigger at all. If it does trigger, the ability will check again as it tries to resolve. If you don't control five or more Towns at that time, the ability won't resolve and none of its effects will happen."},{"object":"ruling","oracle_id":"e6e6e3d2-f2fb-46a1-8798-13a2f2efe8cc","source":"wotc","published_at":"2025-06-06","comment":"If The Wandering Minstrel would enter the battlefield at the same time a land you control would enter the battlefield tapped, that land still enters the battlefield tapped."},{"object":"ruling","oracle_id":"e6e6e3d2-f2fb-46a1-8798-13a2f2efe8cc","source":"wotc","published_at":"2025-06-06","comment":"If a land has an ability that says it enters the battlefield tapped, you choose the order in which that ability's effect and The Wandering Minstrel's effect apply. This means you can choose to have the land enter tapped or untapped. If a land you control is simply put onto the battlefield tapped without a replacement effect being applied, it always enters untapped if you control The Wandering Minstrel."},{"object":"ruling","oracle_id":"e6e6e3d2-f2fb-46a1-8798-13a2f2efe8cc","source":"wotc","published_at":"2025-06-06","comment":"The value of X is calculated only once, as The Wandering Minstrel's last ability resolves."}],"related":[{"object":"related_card","id":"fe592a5c-5e6e-40ed-8818-f4651bcf2fe8","component":"token","name":"Elemental","type_line":"Token Creature — Elemental","uri":"https://api.scryfall.com/cards/fe592a5c-5e6e-40ed-8818-f4651bcf2fe8"},{"object":"related_card","id":"fe9cd860-1b4e-48ec-be30-e0ec4ca75e26","component":"combo_piece","name":"The Wandering Minstrel","type_line":"Legendary Creature — Human Bard","uri":"https://api.scryfall.com/cards/fe9cd860-1b4e-48ec-be30-e0ec4ca75e26"}],"metadataStatus":"canonical","oracleSnapshotAt":"2026-09-12T05:32:48.608797+00:00","candidate":true},{"id":"99720c65-be96-4220-8ed4-720660bf6928","key":"thornglint-bridge","name":"Thornglint Bridge","manaCost":"","manaValue":0,"typeLine":"Artifact Land","types":["Artifact","Land"],"subtypes":[],"supertypes":[],"oracleText":"This land enters tapped.\nIndestructible\n{T}: Add {G} or {W}.","colors":[],"colorIdentity":["G","W"],"keywords":["Indestructible"],"power":null,"toughness":null,"loyalty":null,"defense":null,"layout":"normal","faces":[],"image":"assets/cards/99720c65-be96-4220-8ed4-720660bf6928.jpg","backImage":null,"printId":"9d483643-6a11-47f7-a0aa-190e0179525f","set":"mh2","collectorNumber":"258","source":"https://scryfall.com/card/mh2/258/thornglint-bridge?utm_source=api","rulings":[],"related":[],"metadataStatus":"canonical","oracleSnapshotAt":"2026-09-12T05:32:49.257031+00:00","candidate":true},{"id":"9deded8b-cec4-4ede-a50b-131404d456d4","key":"thought-monitor","name":"Thought Monitor","manaCost":"{6}{U}","manaValue":7,"typeLine":"Artifact Creature — Construct","types":["Artifact","Creature"],"subtypes":["Construct"],"supertypes":[],"oracleText":"Affinity for artifacts (This spell costs {1} less to cast for each artifact you control.)\nFlying\nWhen this creature enters, draw two cards.","colors":["U"] . If you do, discard a card.\n{2}: Put target card from your graveyard on the bottom of your library.","colors":["U"],"colorIdentity":["U"],"keywords":[],"power":"2","toughness":"4","loyalty":null,"defense":null,"layout":"normal","faces":[],"image":"assets/cards/4a60db66-0347-4efc-8507-ab7ed8d984fe.jpg","backImage":null,"printId":"f912c4ec-08e9-4524-a2ba-98f6dfabdc18","set":"one","collectorNumber":"73","source":"https://scryfall.com/card/one/73/transplant-theorist?utm_source=api","rulings":[],"related":[],"metadataStatus":"canonical","oracleSnapshotAt":"2026-09-12T05:32:52.579489+00:00","candidate":true},{"id":"2e5675d3-3fb0-43b5-a65c-95aacbe48bf9","key":"traveling-chocobo","name":"Traveling Chocobo","manaCost":"{2}{G}","manaValue":3,"typeLine":"Creature — Bird","types":["Creature"],"subtypes":["Bird"],"supertypes":[],"oracleText":"You may look at the top card of your library any time.\nYou may play lands and cast Bird spells from the top of your library.\nIf a land or Bird you control entering the battlefield causes a triggered ability of a permanent you control to trigger, that ability triggers an additional time.","colors":["G"],"colorIdentity":["G"],"keywords":[],"power":"3","toughness":"2","loyalty":null,"defense":null,"layout":"normal","faces":[],"image":"assets/cards/2e5675d3-3fb0-43b5-a65c-95aacbe48bf9.jpg","backImage":null,"printId":"2462df62-fc35-47ed-9571-40452074dc6d","set":"fin","collectorNumber":"210","source":"https://scryfall.com/card/fin/210/traveling-chocobo?utm_source=api","rulings":[{"object":"ruling","oracle_id":"2e5675d3-3fb0-43b5-a65c-95aacbe48bf9","source":"wotc","published_at":"2025-06-06","comment":"Replacement effects are unaffected by Traveling Chocobo's ability. For example, a Bird that enters the battlefield under your control with one +1/+1 counter on it won't receive an additional +1/+1 counter."},{"object":"ruling","oracle_id":"2e5675d3-3fb0-43b5-a65c-95aacbe48bf9","source":"wotc","published_at":"2025-06-06","comment":"If the top card of your library changes while you're casting a spell, playing a land, or activating an ability, you can't look at the new top card until you finish doing so. This means that if you cast the top card of your library, you can't look at the next one until you're done paying for that spell."},{"object":"ruling","oracle_id":"2e5675d3-3fb0-43b5-a65c-95aacbe48bf9","source":"wotc","published_at":"2025-06-06","comment":"In some cases involving linked abilities, an ability requires information about \"the exiled card.\" When this happens, the ability gets multiple answers. If these answers are being used to determine the value of a variable, the sum is used. For example, if Clive's Hideaway's hideaway ability triggers twice, two cards are eventually exiled. The last ability of Clive's Hideaway will allow you to cast both exiled cards without paying their mana costs (assuming you control four or more legendary creatures at that time.)"},{"object":"ruling","oracle_id":"2e5675d3-3fb0-43b5-a65c-95aacbe48bf9","source":"wotc","published_at":"2025-06-06","comment":"If a triggered ability is linked to a second ability, additional instances of that triggered ability are also linked to that second ability. If the second ability refers to \"the exiled card,\" it refers to all cards exiled by instances of the triggered ability."},{"object":"ruling","oracle_id":"2e5675d3-3fb0-43b5-a65c-95aacbe48bf9","source":"wotc","published_at":"2025-06-06","comment":"Traveling Chocobo's last ability affects a permanent's own \"enters\" triggered abilities (as long as it's a land or Bird you control) as well as other triggered abilities that trigger when a land or Bird you control enters the battlefield. Such triggered abilities start with \"when\" or \"whenever.\" Some keyword abilities also include a triggered ability that happens when a permanent enters the battlefield."},{"object":"ruling","oracle_id":"2e5675d3-3fb0-43b5-a65c-95aacbe48bf9","source":"wotc","published_at":"2025-06-06","comment":"You must follow all normal timing rules for Bird spells cast and lands played using the middle ability and must pay all costs for spells cast this way. To cast a spell this way, you may choose to pay any alternative costs or optional additional costs the spell may have (such as a kicker cost). You must pay any mandatory additional costs."},{"object":"ruling","oracle_id":"2e5675d3-3fb0-43b5-a65c-95aacbe48bf9","source":"wotc","published_at":"2025-06-06","comment":"In a Two-Headed Giant game, Traveling Chocobo's second ability does not affect triggered abilities of permanents your teammate controls."},{"object":"ruling","oracle_id":"2e5675d3-3fb0-43b5-a65c-95aacbe48bf9","source":"wotc","published_at":"2025-06-06","comment":"Traveling Chocobo lets you look at the top card of your library whenever you want (with one restriction—see below), even if you don't have priority. This action doesn't use the stack. Knowing what that card is becomes part of the information you have access to, just like you can look at the cards in your hand."},{"object":"ruling","oracle_id":"2e5675d3-3fb0-43b5-a65c-95aacbe48bf9","source":"wotc","published_at":"2025-06-06","comment":"If a land or Bird you control entering at the same time as Traveling Chocobo (including Traveling Chocobo itself) causes a triggered ability of a permanent you control to trigger, that ability triggers an additional time."},{"object":"ruling","oracle_id":"2e5675d3-3fb0-43b5-a65c-95aacbe48bf9","source":"wotc","published_at":"2025-06-06","comment":"Abilities that apply \"as [this permanent] enters,\" such as choosing a color with Crossroads Village, are also unaffected."},{"object":"ruling","oracle_id":"2e5675d3-3fb0-43b5-a65c-95aacbe48bf9","source":"wotc","published_at":"2025-06-06","comment":"If you control two Traveling Chocobos, a land or Bird you control entering causes abilities to trigger three times, not four. A third Traveling Chocobo causes abilities to trigger four times, a fourth causes abilities to trigger five times, and so on."},{"object":"ruling","oracle_id":"2e5675d3-3fb0-43b5-a65c-95aacbe48bf9","source":"wotc","published_at":"2025-06-06","comment":"The top card of your library isn't in your hand, so you can't cycle it, discard it, or activate any of its abilities that could be activated from your hand."},{"object":"ruling","oracle_id":"2e5675d3-3fb0-43b5-a65c-95aacbe48bf9","source":"wotc","published_at":"2025-06-06","comment":"Traveling Chocobo's ability doesn't copy the triggered ability; it just causes the ability to trigger an additional time. Any choices made as you put the ability onto the stack, such as modes and targets, are made separately for each instance of the ability. Any choices made on resolution, such as whether to put counters on a permanent, are also made individually."}],"related":[],"metadataStatus":"canonical","oracleSnapshotAt":"2026-09-12T05:32:53.251279+00:00","candidate":true},{"id":"3c549374-6c37-42e0-8d88-a8555d46732d","key":"treasure","name":"Treasure","manaCost":"","manaValue":0,"typeLine":"Token Artifact — Treasure","types":["Artifact"],"subtypes":["Treasure"],"supertypes":[],"oracleText":"{T}, Sacrifice this token: Add one mana of any color.","colors":[],"colorIdentity":[],"keywords":[],"power":null,"toughness":null,"loyalty":null,"defense":null,"layout":"token","faces":[],"image":"assets/cards/3c549374-6c37-42e0-8d88-a8555d46732d.jpg","backImage":null,"printId":"d1892b78-7663-4cbd-a732-9a4b0b18d4c8","set":"thob","collectorNumber":"13","source":"https://scryfall.com/card/thob/13/treasure?utm_source=api","rulings":[],"related":[{"object":"related_card","id":"f679da19-5dac-4be6-983d-fee7e80cdb9c","component":"combo_piece","name":"Ruthless Knave","type_line":"Creature — Orc Pirate","uri":"https://api.scryfall.com/cards/f679da19-5dac-4be6-983d-fee7e80cdb9c"},{"object":"related_card","id":"7ba507e2-fe5e-4947-aada-20184aa09700","component":"combo_piece","name":"Surly Badgersaur","type_line":"Creature — Badger Dinosaur","uri":"https://api.scry t from untapping during another player's untap step."},{"object":"ruling","oracle_id":"153fac93-5d2b-4348-a468-a5eef6a12da3","source":"wotc","published_at":"2011-06-01","comment":"Even if you control more than one Unwinding Clock, you'll only untap your artifacts once during each other player's untap step."}],"related":[],"metadataStatus":"canonical","oracleSnapshotAt":"2026-09-12T05:32:57.243656+00:00","candidate":true},{"id":"4c6a0c30-b547-4eff-8ff4-0ca25803c076","key":"urza-s-saga","name":"Urza's Saga","manaCost":"","manaValue":0,"typeLine":"Enchantment Land — Urza's Saga","types":["Enchantment","Land"],"subtypes":["Urza's","Saga"],"supertypes":[],"oracleText":"(As this Saga enters and after your draw step, add a lore counter. Sacrifice after III.)\nI — This Saga gains \"{T}: Add {C}.\"\nII — This Saga gains \"{2}, {T}: Create a 0/0 colorless Construct artifact creature token with 'This token gets +1/+1 for each artifact you control.'\"\nIII — Search your library for an artifact card with mana cost {0} or {1}, put it onto the battlefield, then shuffle.","colors":[],"colorIdentity":[],"keywords":[],"power":null,"toughness":null,"loyalty":null,"defense":null,"layout":"saga","faces":[],"image":"assets/cards/4c6a0c30-b547-4eff-8ff4-0ca25803c076.jpg","backImage":null,"printId":"c1e0f201-42cb-46a1-901a-65bb4fc18f6c","set":"mh2","collectorNumber":"259","source":"https://scryfall.com/card/mh2/259/urzas-saga?utm_source=api","rulings":[{"object":"ruling","oracle_id":"4c6a0c30-b547-4eff-8ff4-0ca25803c076","source":"wotc","published_at":"2021-06-18","comment":"Urza's Saga is a land, so it can only be played as a land. It cannot be cast as a spell."},{"object":"ruling","oracle_id":"4c6a0c30-b547-4eff-8ff4-0ca25803c076","source":"wotc","published_at":"2021-06-18","comment":"Urza's Saga gains an ability from its first and second chapters. It keeps those abilities for as long as it's on the battlefield."},{"object":"ruling","oracle_id":"4c6a0c30-b547-4eff-8ff4-0ca25803c076","source":"wotc","published_at":"2021-06-18","comment":"While resolving the chapter III ability, you can find only a card with actual mana cost {0} or {1}, not mana value 0 or 1. For example, you couldn't find a card with mana cost {U} or one with mana cost {X}."},{"object":"ruling","oracle_id":"4c6a0c30-b547-4eff-8ff4-0ca25803c076","source":"wotc","published_at":"2021-06-18","comment":"Even though Urza's Saga is a land, it is also still a Saga, and it will be sacrificed after its last chapter ability resolves."},{"object":"ruling","oracle_id":"4c6a0c30-b547-4eff-8ff4-0ca25803c076","source":"wotc","published_at":"2021-06-18","comment":"Although Urza's Saga has the Urza's land type, it doesn't interact with Urza's Tower, Urza's Mine, or Urza's Power Plant."}],"related":[{"object":"related_card","id":"2138dfbb-a4e3-49db-b908-95d0b2b7e82f","component":"combo_piece","name":"Urza's Saga","type_line":"Enchantment Land — Urza's Saga","uri":"https://api.scryfall.com/cards/2138dfbb-a4e3-49db-b908-95d0b2b7e82f"},{"object":"related_card","id":"a7caaf39-8f16-4f1d-bee6-a45674306319","component":"token","name":"Construct","type_line":"Token Artifact Creature — Construct","uri":"https://api.scryfall.com/cards/a7caaf39-8f16-4f1d-bee6-a45674306319"}],"metadataStatus":"canonical","oracleSnapshotAt":"2026-09-12T05:32:57.820774+00:00","candidate":true},{"id":"e87906d2-db1a-4e19-b910-adb4eb339945","key":"urza-lord-high-artificer","name":"Urza, Lord High Artificer","manaCost":"{2}{U}{U}","manaValue":4,"typeLine":"Legendary Creature — Human Artificer","types":["Creature"],"subtypes":["Human","Artificer"],"supertypes":["Legendary"],"oracleText":"When Urza enters, create a 0/0 colorless Construct artifact creature token with \"This token gets +1/+1 for each artifact you control.\"\nTap an untapped artifact you control: Add {U}.\n{5}: Shuffle your library, then exile the top card. Until end of turn, you may play that card without paying its mana cost.","colors":["U"],"colorIdentity":["U"],"keywords":[],"power":"1","toughness":"4","loyalty":null,"defense":null,"layout":"normal","faces":[],"image":"assets/cards/e87906d2-db1a-4e19-b910-adb4eb339945.jpg","backImage":null,"printId":"7b7a348a-51f7-4dc5-8fe7-1c70fea5e050","set":"cmm","collectorNumber":"130","source":"https://scryfall.com/card/cmm/130/urza-lord-high-artificer?utm_source=api","rulings":[{"object":"ruling","oracle_id":"e87906d2-db1a-4e19-b910-adb4eb339945","source":"wotc","published_at":"2022-12-08","comment":"The token created by Urza's first ability will count itself, so it'll be at least 1/1."},{"object":"ruling","oracle_id":"e87906d2-db1a-4e19-b910-adb4eb339945","source":"wotc","published_at":"2022-12-08","comment":"You can tap any untapped artifact you control to pay the cost of the mana ability, including an artifact creature you haven't controlled continuously since the beginning of your most recent turn. Tapping an Equipment this way won't affect its abilities or the equipped creature."},{"object":"ruling","oracle_id":"e87906d2-db1a-4e19-b910-adb4eb339945","source":"wotc","published_at":"2022-12-08","comment":"If you don't play the card exiled with Urza's last ability, it remains in exile."},{"object":"ruling","oracle_id":"e87906d2-db1a-4e19-b910-adb4eb339945","source":"wotc","published_at":"2022-12-08","comment":"Urza's last ability doesn't change when you can play the exiled card. For example, if you exile a sorcery card, you can cast it only during your main phase when the stack is empty. If you exile a land card, you can play it only during your main phase and only if you have an available land play remaining."},{"object":"ruling","oracle_id":"e87906d2-db1a-4e19-b910-adb4eb339945","source":"wotc","published_at":"2022-12-08","comment":"If a spell has {X} in its mana cost, you must choose 0 as the value of X when casting it without paying its mana cost."},{"object":"ruling","oracle_id":"e87906d2-db1a-4e19-b910-adb4eb339945","source":"wotc","published_at":"2022-12-08","comment":"If you cast a card \"without paying its mana cost,\" you can't choose to cast it for any alternative costs. You can, however, pay additional costs. If the card has any mandatory additional costs, you must pay those to cast the card."}],"related":[{"object":"related_card","id":"3e286a7c-9643-492f-8ce9-255499dfd1a7","component":"combo_piece","name":"Urza, Lord High Artificer","type_line":"Legendary Creature — Human Artificer","uri":"https://api.scryfall.com/cards/3e286a7c-9643-492f-8ce9-255499dfd1a7"},{"object":"related_card","id":"48fdadab-af27-46d3-bcf6-35e7affb1e43","component":"token","name":"Construct","type_line":"Token Artifact Creature — Construct","uri":"https://api.scryfall.com/cards/48fdadab-af27-46d3-bcf6-35e7affb1e43"}],"metadataStatus":"canonical","oracleSnapshotAt":"2026-09-12T05:32:58.475999+00:00","candidate":true},{"id":"df2af646-3e5b-43a3-8f3e-50565889f456","key":"urza-lord-protector","name":"Urza, Lord Protector","manaCost":"{1}{W}{U}","manaValue":3,"typeLine":"Legendary Creature — Human Artificer","types":["Creature"],"subtypes":["Human","Artificer"],"supertypes":["Legendary"],"oracleText":"Artifact, instant, and sorcery spells you cast cost {1} less to cast.\n{7}: If you both own and control Urza, Lord Protector and an artifact named The Mightstone and Weakstone, exile them, then meld them into Urza, Planeswalker. Activate only as a sorcery.","colors":["U","W"],"colorIdentity":["U","W"],"keywords":["Meld"],"power":"2","toughness":"4","loyalty":null,"defense":null,"layout":"meld","faces":[],"image":"assets/cards/df2af646-3e5b-43a3-8f3e-50565889f456.jpg","backImage":null,"printId":"8aefe8bd-216a-4ec1-9362-3f9dbf7fd083","set":"bro","collectorNumber":"225","source":"https://scryfall.com/card/bro/225/urza-lord-protector?utm_source=api","rulings":[{"object":"ruling","oracle_id":"df2af646-3e5b-43a3-8f3e-50565889f456","source":"wotc","published_at":"2022-10-14","comment":"Urza, Lord Protector's first ability can't reduce the colored mana costs of spells you cast."},{"object":"ruling","oracle_id":"df2af646-3e5b-43a3-8f3e-50565889f456","source":"wotc","published_at":"2022-10-14","comment":"During each of your turns, you may activate Urza, Planeswalker's loyalty abilities twice, whether that's activating the same ability two times, or activating two different abilities once each."},{"object":"ruling","oracle_id":"df2af646-3e5b-43a3-8f3e-50565889f456","source":"wotc","published_at":"2022-10-14","comment":"When a pair of cards are melded, the result is a single creature that's represented by two cards. If the melded creature dies, both cards are put into your graveyard. As it leaves the battlefield, both of those cards are turned face up again. If the cards are put on the top or bottom of your library, you choose their relative order."},{"object":"ruling","oracle_id":"df2af646-3e5b-43a3-8f3e-50565889f456","source":"wotc","published_at":"2022-10-14","comment":"One card in each pair of meld cards has an ability that instructs you to exile the two cards and meld them. If you control more than one object with one of those names, you select one object with that name to exile."},{"object":"ruling","oracle_id":"df2af646-3e5b-43a3-8f3e-50565889f456","source":"wotc","published_at":"2022-10-14","comment":"When two cards are exiled and melded, they each leave the battlefield, then return together as one new object with no relation to either of the objects that left the battlefield. Counters, Auras, Equipment, and other effects that affected those two cards don't affect the melded permanent."},{"object":"ruling","oracle_id":"df2af646-3e5b-43a3-8f3e-50565889f456","source":"wotc","published_at":"2022-10-14","comment":"Only two cards belonging to the same meld pair can be melded. Tokens, cards that aren't meld cards, or meld cards that don't form a meld pair can't be melded. If an effect instructs a player to meld cards that can't be melded, those cards remain in exile."},{"object":"ruling","oracle_id":"df2af646-3e5b-43a3-8f3e-50565889f456","source":"wotc","published_at":"2022-10-14","comment":"While a meld card is in any zone other than the battlefield, it has only the characteristics of its front face. The same is true while it's on the battlefield with its front face up."},{"object":"ruling","oracle_id":"df2af646-3e5b-43a3-8f3e-50565889f456","source":"wotc","published_at":"2022-10-14","comment":"While a melded permanent is on the battlefield, it has only the characteristics of its combined back face. Any effects that modify how the new object enters the battlefield will consider only the combined back face."},{"object":"ruling","oracle_id":"df2af646-3e5b-43a3-8f3e-50565889f456","source":"wotc","published_at":"2022-10-14","comment":"Note that the permanent represented by the combined back faces has a color indicator."},{"object":"ruling","oracle_id":"df2af646-3e5b-43a3-8f3e-50565889f456","source":"wotc","published_at":"2022-10-14","comment":"The mana value of a melded permanent is the sum of the mana values of its front faces. A creature that becomes a copy of a melded permanent has only the characteristics of that combined back face, and its mana value is 0."},{"object":"ruling","oracle_id":"df2af646-3e5b-43a3-8f3e-50565889f456","source":"wotc","published_at":"2022-10-14","comment":"A player prompted to name a card may name the combined back face, and each player has the right to know that combined back face's characteristics at all times."},{"object":"ruling","oracle_id":"df2af646-3e5b-43a3-8f3e-50565889f456","source":"wotc","published_at":"2022-10-14","comment":"If an effect moves a melded permanent to a new zone and then affects \"that card,\" it affects both cards."},{"object":"ruling","oracle_id":"df2af646-3e5b-43a3-8f3e-50565889f456","source":"wotc","published_at":"2022-10-14","comment":"In the Commander variant, a meld card's color identity is determined only by the mana costs and mana symbols in the rules text of its front face. No symbols or rules text of the permanent it melds into are consider ane, Teller of Tales\n1 Roil Cartographer\n1 Birthing Pod\n1 Elvish Reclaimer\n1 Scrabbling Claws\n1 Metalworker\n"};</script><script>(()=>{'use strict';const factories={"src/ui/app.js":(module,exports,require)=>{

async function saveNow(){if(!g)return;clearTimeout(saveTimer);const sequence=gameSequence,snapshot=g.exportSession();try{const at=await store.save(snapshot);if(sequence===gameSequence){saveStatus.text=`Autosaved ${new Date(at).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'})}`;saveStatus.error=false;updateSaveLabel();}}catch(error){if(sequence===gameSequence){saveStatus.text=error.message;saveStatus.error=true;updateSaveLabel();}throw error;}}
function scheduleSave(){clearTimeout(saveTimer);saveStatus.text='Saving…';updateSaveLabel();saveTimer=setTimeout(()=>saveNow().catch(()=>{}),100);}

function focusSnapshot(){const a=document.activeElement;return a?.id?{id:a.id,start:a.selectionStart,end:a.selectionEnd}:null;}
function restoreFocus(f){if(!f)return;const el=byId(f.id);if(!el)return;el.focus({preventScroll:true});if(typeof f.start==='number'&&typeof el.setSelectionRange==='function')try{el.setSelectionRange(f.start,f.end);}catch{}}
function prepareChoice(){const p=g.state.pending;const key=p?JSON.stringify([p.kind,p.key,p.label,p.source,p.candidates,p.options,g.state.resolving?.pc,g.state.actionDraft?.context?.inputs]):null;if(key===ui.pendingKey)return;ui.pendingKey=key;ui.choiceFilter='';ui.choice=p?.ordered?[...(p.candidates||choiceOptions(p).map(o=>o.value))]:[];ui.number=p?.min||0;ui.payment=p?.cost?suggestPayment(p.cost,g.state.players[p.player||0],p.context)||{normal:{},tagged:[]}:null;}
function render(){if(!g||rendering)return;rendering=true;prepareChoice();const focus=focusSnapshot(),scroll=new Map([...document.querySelectorAll('[data-scroll]')].map(el=>[el.dataset.scroll,[el.scrollLeft,el.scrollTop]]));document.documentElement.style.setProperty('--card',`${ui.cardSize}px`);root.innerHTML=headerHTML(ctx())+`<div class="workspace">${sidebarHTML(ctx())}${tableHTML(ctx())}${inspectorHTML(ctx())}</div><footer class="status-bar"><span>SEED ${h(g.state.seed)} · ${g.cursor} actions${g.state.initialDeck.scenario?' · Laboratory fixture':''}</span><span id="save-status">${h(saveStatus.text)}</span><span>${h(g.state.rulesPack)} · Local rules · No runtime network</span></footer>`;renderModal(false);for(const el of document.querySelectorAll('[data-scroll]')){const xy=scroll.get(el.dataset.scroll);if(xy){el.scrollLeft=xy[0];el.scrollTop=xy[1];}}restoreFocus(focus);rendering=false;requestAnimationFrame(()=>{const width=byId('canvas')?.clientWidth;if(width&&Math.abs(width-ui.canvasWidth)>4&&!drag){ui.canvasWidth=width;render();}});}
function renderModal(preserve=true){const focus=preserve?focusSnapshot():null,scroll=overlay.querySelector('.modal-body')?.scrollTop||0;overlay.innerHTML=dialogHTML(ctx());document.body.classList.toggle('no-scroll',!!ui.modal);root.inert=!!ui.modal;if(preserve){const b=overlay.querySelector('.modal-body');if(b)b.scrollTop=scroll;restoreFocus(focus);}}
function openDialog(name){ui.modal=name;if(name==='new')ui.seed=seed();renderModal();requestAnimationFrame(()=>overlay.querySelector('input:not([type=checkbox]),textarea,button')?.focus());}
function run(action){const result=g.perform(action);if(!result.ok)toast(result.error.message,true);else if(!g.state.settings.holdPriority&&!g.state.pending&&!g.state.actionDraft&&!g.state.resolving&&['CAST_SPELL','ACTIVATE_ABILITY','CHOOSE','SPECIAL_ACTION'].includes(action.type)&&g.state.stack.length){const resolved=g.perform({type:'RESOLVE_ALL'});if(!resolved.ok)toast(resolved.error.message,true);}return result;}

function toggleChoice(id){const p=g.state.pending,ids=p?.candidates||p?.ids||[];if(!ids.includes(id))return false;if(ui.choice.includes(id))ui.choice=ui.choice.filter(v=>v!==id);else if((p.max||1)===1)ui.choice=[id];else if(ui.choice.length<(p.max||1))ui.choice.push(id);else{toast(`Choose at most ${p.max} cards.`,true);return true;}render();return true;}
function auditDeck(){const parsed=parseDeck(ui.deckText),report=registry.report(parsed.records),errors=parsed.errors.map(e=>`Line ${e.line}: ${e.message}`);let construction=null;if(!errors.length&&!report.missing.length)try{const trial=Engine.create(registry,parsed.records,'deck-audit');construction=trial.state.initialDeck;}catch(error){errors.push(error.message);}const accepted=report.accepted&&!errors.length;const lines=[...errors,...report.missing.map(r=>`MISSING: ${r.quantity} ${r.name}`),...report.partial.map(r=>`PARTIAL: ${r.name} — ${r.notes}`),...report.duplicates.map(r=>`DUPLICATE (preserved): ${r.quantity} ${r.name}`)];ui.deckReport={...report,accepted,errors,records:parsed.records,construction,summary:accepted?`Ready: ${construction.fixedLands} fixed lands + ${construction.selectedNonlands} selected nonlands; ${construction.reserveOrder.length} reserve candidates.`:'Deck is not ready. Resolve the issues below.',details:lines.join('\n')||'All names have registered rules. No duplicate names found.'};return ui.deckReport;}

async function importFile(file){if(!file)return;if(file.size>50*1024*1024)throw new Error('Session exceeds the 50 MB import limit.');const document=JSON.parse(await file.text()),next=Engine.importSession(registry,document);useEngine(next);toast('Session imported and integrity checks passed.');}
function arrange(){const ids=g.state.zones[ui.zone]||[],columns=Math.max(1,Math.floor((ui.canvasWidth-22)/(ui.cardSize+15))),height=ui.cardSize*88/63+54;run({type:'LAYOUT',updates:ids.map((id,i)=>({id,x:12+(i%columns)*(ui.cardSize+15),y:14+Math.floor(i/columns)*height}))});}
async function handleClick(event){if(Date.now()<ignoreClickUntil)return;const el=event.target.closest('[data-action]');if(!el)return;const action=el.dataset.action,id=el.dataset.id;
  if(action==='backdrop'){if(event.target===el){ui.modal=null;renderModal();}return;}
  if(action==='dialog')return openDialog(el.dataset.dialog);
  if(action==='close-dialog'){ui.modal=null;return renderModal();}
  if(action==='undo')return run({type:'UNDO'});if(action==='redo')return run({type:'REDO'});
  if(action==='mana')return run({type:'ADJUST_MANA',color:el.dataset.color,delta:Number(el.dataset.delta)});
  if(action==='clear-mana'){for(const c of COLORS)if(g.state.players[0].mana[c])run({type:'ADJUST_MANA',color:c,delta:-g.state.players[0].mana[c]});return;}
  if(action==='resource')return run({type:'ADJUST_PLAYER',player:Number(el.dataset.player),field:el.dataset.field,delta:Number(el.dataset.delta)});
  if(action==='keep')return run({type:'KEEP_HAND'});if(action==='mulligan')return run({type:'MULLIGAN'});
  if(action==='phase')return run({type:'ADVANCE_PHASE',step:el.dataset.step});if(action==='next')return run({type:'ADVANCE_PHASE',next:true});
  if(action==='next-turn')return run({type:'ADVANCE_PHASE',player:0,step:'main1',nextTurn:true});
  if(action==='opponent')return run({type:'ADVANCE_PHASE',player:Number(el.dataset.player),step:'main1'});
  if(action==='resolve')return run({type:'RESOLVE_TOP'});if(action==='resolve-all')return run({type:'RESOLVE_ALL'});if(action==='pass')return run({type:'PASS_PRIORITY'});
  if(action==='zone'){ui.zone=el.dataset.zone;ui.selected.clear();return render();}
  if(action==='select-mode'){ui.selectMode=!ui.selectMode;if(!ui.selectMode)ui.selected.clear();return render();}
  if(action==='arrange')return arrange();
  if(action==='inspect')return inspect(id);
  if(action==='card'){if(g.state.pending&&toggleChoice(id))return;if(ui.selectMode||event.shiftKey){ui.selected.has(id)?ui.selected.delete(id):ui.selected.add(id);return render();}const o=g.object(id);if(o?.zone==='battlefield'&&!g.state.pending&&g.abilities(o).filter(a=>a.mana&&a.tap).length===1)return run({type:'CARD_CLICK',id});return inspect(id);}
  if(action==='cast')return run({type:g.characteristics(id).types.includes('Land')?'PLAY_LAND':'CAST_SPELL',id});
  if(action==='ability')return run({type:'ACTIVATE_ABILITY',id,abilityId:el.dataset.ability});if(action==='plot')return run({type:'SPECIAL_ACTION',id,special:'plot'});
  if(action==='cancel')return run({type:'CANCEL'});
  if(action==='confirm-choice')return choose([...ui.choice]);if(action==='confirm-number')return choose(Number(byId('number-choice').value));
  if(action==='suggest-payment'){ui.payment=suggestPayment(g.state.pending.cost,g.state.players[g.state.pending.player||0],g.state.pending.context);return render();}
  if(action==='pay')return choose(ui.payment);

  if(action==='option'){const p=g.state.pending,value=choiceOptions(p)[Number(el.dataset.option)].value;if((p.max||1)>1){ui.choice=ui.choice.includes(value)?ui.choice.filter(v=>v!==value):[...ui.choice,value];return render();}return choose(value);}
  if(action==='order'){const from=Number(el.dataset.index),to=from+Number(el.dataset.direction);if(to>=0&&to<ui.choice.length)[ui.choice[from],ui.choice[to]]=[ui.choice[to],ui.choice[from]];return render();}

const { clone, ref, sameRef, asArray, unique, requireRule }=require("src/core/util.js");

  emit(type, detail = {}, previousSources = []) {

    const sources = [...current, ...previousSources].filter((o, i, all) => all.findIndex(p => sameRef(p, o)) === i);
    for (const source of sources) {

        if (trigger.interveningIf && !trigger.interveningIf(this, context)) continue;

        if ((trigger.oncePerBatch || trigger.oncePerTurn) && this.state.triggerCounts[countKey]) continue;
        if (trigger.oncePerBatch || trigger.oncePerTurn) this.state.triggerCounts[countKey] = 1;

        for (const doubling of this.objects('battlefield')) {
          const rule = this.module(doubling).triggerMultiplier;
          if (rule && rule(this, doubling, event, source)) multiplier += 1;

        for (let i = 0; i < multiplier; i++) this.queueTrigger({
          source: ref(source), sourceCardId: context.sourceCardId, controller: source.controller,
          abilityId: trigger.id, label: `${this.definition(source).name} — ${trigger.label || trigger.id}`,
          context, optional: !!trigger.optional, multiplierIndex: i,

  },

  triggerDefinition(stackObject) {

  settle() {

      if (this.checkStateActions()) continue;

      if (this.state.pendingTriggers.length) { this.flushTriggers(); return; }

    const groups = [];
    for (let offset = 0; offset < 4; offset++) {
      const controller = (this.state.activePlayer + offset) % 4;

  prepareTriggerGroup() {

      this.state.pending = { kind: 'triggerOrder', label: `Order ${group.triggers.length} simultaneous triggers`,
        description: 'Arrange the order you want them to RESOLVE. The first item resolves first. All triggers in this group have the same controller.',
        controller: group.controller, min: group.triggers.length, max: group.triggers.length, ordered: true,
        options: group.triggers.map(t => ({ value: t.id, label: t.label })), triggers: group.triggers };

  acceptTriggerOrder(values) {

    if (object.kind === 'spell') {
      const source = this.object(object.source), c = source && this.characteristics(source);
      if (c?.types.some(t => ['Artifact', 'Creature', 'Enchantment', 'Land', 'Planeswalker', 'Battle'].includes(t))) commands = [{ op: 'enterSpell' }, ...commands];
      commands.push({ op: 'finishSpell', destination: definition.exileAfter ? 'exile' : 'graveyard' });
    }

  resolveAll(limit = 1000) {

  },
};

Object.assign(exports,{eventMethods});
},
"src/core/phases.js":(module,exports,require)=>{
const { STEPS, COLORS, emptyMana, clone, ref, unique, requireRule, integer }=require("src/core/util.js");

  advancePhase(action = {}) {

        label: emblem.label, program: clone(emblem.program), inputSpecs: clone(emblem.inputs || []), context: { controller: player, source: null, sourceCardId: emblem.sourceCardId, vars: {}, inputs: {}, event: { player, step, turnSerial: this.state.turnSerial } } });
    } else if (step === 'end') {
      this.emit('END_STEP', { player });
      const due = this.state.delayed.filter(d => d.when === 'nextEnd' || (d.when === 'yourEnd' && d.controller === player));
      this.state.delayed = this.state.delayed.filter(d => !due.includes(d));
      for (const delayed of due) this.queueTrigger({ controller: delayed.controller, source: delayed.context.source, sourceCardId: delayed.context.sourceCardId,
        abilityId: delayed.id, label: delayed.label, program: delayed.program, context: clone(delayed.context) });
    } else if (step === 'cleanup') {
      this.state.effects = this.state.effects.filter(e => e.expires !== 'endOfTurn');
      for (const object of this.objects('battlefield')) {
        object.damage = 0; delete object.flags.attacking;
        object.modifications = object.modifications.filter(m => m.expires !== 'endOfTurn');
      }
      this.touch();
      if (player === 0 && this.state.zones.hand.length > 7) {
        const excess = this.state.zones.hand.length - 7;
        this.state.pending = { kind: 'cleanupDiscard', label: `Discard ${excess} to maximum hand size`, candidates: [...this.state.zones.hand], min: excess, max: excess };
      } else if (player !== 0) this.state.players[player].abstractHand = Math.min(7, this.state.players[player].abstractHand);
      this.emit('CLEANUP', { player });
    }
  },
  declareAttackers(action) {
    requireRule(this.state.activePlayer === 0 && this.state.step === 'attackers', 'Declare attackers during your declare-attackers step.');
    requireRule(!this.state.attackersDeclared, 'Attackers have already been declared this combat.');
    const entries = (action.attackers || []).map(a => typeof a === 'string' ? { id: a, player: action.player ?? 1 } : a);
    requireRule(unique(entries.map(a => a.id)).length === entries.length, 'A creature cannot be declared twice.');
    for (const attacker of entries) {
      const object = this.object(attacker.id);
      requireRule(object?.zone === 'battlefield' && object.controller === 0 && this.characteristics(object).types.includes('Creature'), 'Choose creatures you control.');
      requireRule(!object.tapped && !this.isSick(object), 'An attacker must be untapped and not have summoning sickness.');
      requireRule(!this.characteristics(object).keywords.includes('Defender'), 'A creature with defender cannot attack.');
      requireRule(attacker.player >= 1 && attacker.player <= 3 && !this.state.players[attacker.player].lost, 'Choose a remaining opponent.');
    }
    this.state.attackersDeclared = true;
    for (const attacker of entries) {
      const object = this.object(attacker.id); object.attacksThisTurn++; object.flags.attacking = { player: attacker.player, combatId: this.state.currentExtraCombat?.id || `normal-${this.state.turnSerial}` };
    }
    this.touch();
    this.tapObjects(entries.filter(a => !this.characteristics(a.id).keywords.includes('Vigilance')).map(a => a.id), true, 'attack');
    for (const attacker of entries) this.emit('ATTACK_DECLARED', { object: ref(this.object(attacker.id)), player: attacker.player, controller: 0 });
    this.record('ATTACKERS_DECLARED', { attackers: entries });
  },
};

Object.assign(exports,{phaseMethods});
},

"src/rules/helpers.js":(module,exports,require)=>{

"src/rules/lands.js":(module,exports,require)=>{
const { ref, sameRef, unique }=require("src/core/util.js");
const { register, BF, GY, HAND, LIB, anyColor, options, colorInput, xInput, target, selfSacrifice, discardCost, mana, draw, choose, move, search, etb, upkeep, landfall, countType, tapOthers, selected }=require("src/rules/helpers.js");

    { id: 'restricted-color', label: 'Add any color (artifact spell/ability only)', mana: true, tap: true, inputs: [colorInput()], effect: (g, ctx) => [{ op: 'mana', color: ctx.inputs.color, restriction: 'artifactSpellOrAbility' }] },
  ], triggers: [{ id: 'modular', label: 'Modular 1', event: 'LEAVE', lookBack: true, test: (g, s, e) => e.change.to === 'graveyard' && sameRef(s, e.change.beforeRef), optional: true,
    inputs: [target({ zones: ['battlefield'], allTypes: ['Artifact', 'Creature'] })], effect: (g, ctx) => [{ op: 'counter', ids: '$input.target', type: '+1/+1', amount: ctx.event.change.lki.counters['+1/+1'] || 0 }] }] });

  register(registry, 'Fomori Vault', { activated: [{ id: 'vault', label: 'Look at top cards; keep one', cost: '{3}', tap: true, costs: [discardCost()],

      move('$var.vaultKeep', 'hand'), { op: 'call', handler: 'lands.vault-bottom' }] }] });

      effect: g => [search({ artifact: true, ids: g.activeLibrary().filter(id => ['{0}', '{1}'].includes(g.definition(g.object(id)).manaCost)) }, 'battlefield')] },
  ] });

Object.assign(exports,{installLands});

"src/rules/tutors-recursion.js":(module,exports,require)=>{
const { ref, sameRef, unique, asArray }=require("src/core/util.js");
const { register, BF, GY, HAND, LIB, PERMANENT_TYPES, target, selectInput, sacrifice, selfSacrifice, selfExile, draw, choose, move, optional, search, etb, upkeep, countType, paid, paidMV, selected, selfDied, ownArtifactLeft }=require("src/rules/helpers.js");

  const card = g.object(change.afterRef);
  return change.turnSerial === g.state.turnSerial && change.from === 'battlefield' && change.to === 'graveyard' && card?.zone === 'graveyard' && !card.token &&
    (allPlayers || card.owner === controller) && (!types || g.characteristics(card).types.some(t => types.includes(t)));
}).map(c => c.id));

  for (const spec of [normalLadder('Oswald Fiddlebender', 'Artifact', '{W}'), normalLadder('Repurposing Bay', 'Artifact', '{2}', true, true), normalLadder('Birthing Pod', 'Creature', '{1}{G/P}')]) {

    activated: [{ id: 'exchange', label: 'Sacrifice an artifact; return an artifact with MV ≤ 3', cost: '{R}', tap: true, costs: [sacrifice({ ...BF, artifact: true })],
      inputs: [target({ ...artifactGY, manaValue: { lte: 3 } })], effect: () => [move('$input.target', 'battlefield', { cause: 'reanimate' })] }] });

      return [];

"src/ui/storage.js":(module,exports,require)=>{
/** Transactional browser persistence. Failure is surfaced, never called saved. */
class SessionStore {
  constructor() { this.database = null; this.mode = 'memory'; this.chain = Promise.resolve(); }
  async open() {
    try {
      this.database = await new Promise((resolve, reject) => {
        const request = indexedDB.open('astra-goldfish-v1', 1);
        request.onupgradeneeded = () => request.result.createObjectStore('sessions');
        request.onsuccess = () => resolve(request.result); request.onerror = () => reject(request.error);
        request.onblocked = () => reject(new Error('Close another old Astra tab to enable autosave.'));
      });
      this.mode = 'indexeddb';
    } catch {
      try { localStorage.setItem('astra-storage-test', '1'); localStorage.removeItem('astra-storage-test'); this.mode = 'localstorage'; } catch { this.mode = 'memory'; }
    }
    return this;
  }
  async get(key = 'current') {
    if (this.mode === 'indexeddb') return new Promise((resolve, reject) => {
      const request = this.database.transaction('sessions').objectStore('sessions').get(key);
      request.onsuccess = () => resolve(request.result || null); request.onerror = () => reject(request.error);
    });
    if (this.mode === 'localstorage') { const text = localStorage.getItem(`astra-session-${key}`); return text ? JSON.parse(text) : null; }
    return null;
  }
  save(session) {
    const envelope = {savedAt: new Date().toISOString(), session};
    this.chain = this.chain.catch(() => {}).then(async () => {
      if (this.mode === 'memory') throw new Error('Browser storage is unavailable. Export your session to preserve it.');
      if (this.mode === 'indexeddb') return new Promise((resolve, reject) => {
        const tx = this.database.transaction('sessions', 'readwrite'), store = tx.objectStore('sessions');
        const previous = store.get('current');
        previous.onsuccess = () => { if (previous.result) store.put(previous.result, 'previous'); store.put(envelope, 'current'); };
        tx.oncomplete = () => resolve(envelope.savedAt); tx.onerror = () => reject(tx.error); tx.onabort = () => reject(tx.error || new Error('Autosave transaction was interrupted.'));
      });
      // Preserve a previous good record, even if a quota error rejects the next write.
      const previous = localStorage.getItem('astra-session-current');
      if (previous) localStorage.setItem('astra-session-previous', previous);
      localStorage.setItem('astra-session-current', JSON.stringify(envelope));
      return envelope.savedAt;
    });
    return this.chain;
  }
}

Object.assign(exports,{SessionStore});
},

e counts can be adjusted. Blocking and combat damage assignment are user-assisted. Developer overrides are off by default and conspicuously logged. Unsupported deck names are rejected rather than silently treated as vanilla cards.</p></section></div><div class="callout">Runtime is offline. All 175 card, token and derived-face images are included locally. Metadata import belongs to the developer workflow, not to a play session.</div>`;
